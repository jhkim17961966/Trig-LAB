function issues(d){let a=[];if(!d.team.trim())a.push('모둠 이름을 입력하세요.');if(!d.name.trim())a.push('연구소 이름을 입력하세요.');if(!d.book.trim())a.push('교과서 이름을 입력하세요.');if(!d.password.trim())a.push('최종 암호를 정하세요.');if([...d.password].length!==d.puzzles.length)a.push('최종 암호 글자 수와 보안 장치 수가 같아야 합니다.');if(new Set(d.puzzles.map(p=>p.object)).size!==d.puzzles.length)a.push('한 물체에 두 문제를 배치할 수 없습니다.');d.puzzles.forEach((p,i)=>{let n=i+1;if(!p.prompt.trim()||!p.answer.trim())a.push(`${n}번 장치에 문제와 정답을 입력하세요.`);if(!p.letter.trim()||[...p.letter].length!==1)a.push(`${n}번 장치의 목표 글자를 정확히 1글자로 작성하세요.`);if(![p.page,p.line,p.index].every(x=>Number.isInteger(+x)&&+x>0))a.push(`${n}번 장치의 페이지·줄·글자 번호를 확인하세요.`);if(p.type==='choice'&&(!p.choices.every(s=>s.trim())||!p.choices.some(x=>correct(x,p.answer))))a.push(`${n}번 장치의 보기 4개 중에 정답을 포함하세요.`)});if(d.puzzles.every(p=>p.letter.trim())&&d.puzzles.map(p=>p.letter).join('')!==d.password)a.push('각 단서의 글자를 차례대로 이어 만든 문자열이 최종 암호와 일치하지 않습니다.');return [...new Set(a)]}

function icon(kind){const common='fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"';const paths={console:'<rect x="7" y="10" width="34" height="27" rx="3"/><path d="M12 16h24M16 24h8m6 0h5M16 30h19M12 41h24"/>',cabinet:'<rect x="10" y="5" width="28" height="39" rx="3"/><path d="M10 24h28M30 14v6m0 10v6M19 10h5"/>',scope:'<path d="M9 41h32M15 41l4-6h18M26 10l10 10-6 5-11-10 7-5ZM22 19l-5 7m16 1a12 12 0 0 1-17 11"/><circle cx="30" cy="12" r="2"/>',clock:'<circle cx="24" cy="24" r="18"/><path d="M24 13v12l9 5"/><circle cx="24" cy="24" r="2"/>',terminal:'<rect x="5" y="8" width="38" height="29" rx="3"/><path d="M18 42h12M24 37v5M11 18h14M11 24h24"/>',book:'<path d="M24 9c-7-5-15-4-19-3v32c7-1 14-1 19 4m0-33c7-5 15-4 19-3v32c-7-1-14-1-19 4V9Z"/>',door:'<rect x="12" y="5" width="26" height="37" rx="2"/><circle cx="33" cy="24" r="2"/>'};return `<svg viewBox="0 0 48 48" aria-hidden="true" ${common}>${paths[kind]||paths.console}</svg>`}

function home(){return `<div class="wrap"><section class="homehero"><div><span class="pill">중학교 3학년 · 삼각비 · 4인 협력 제작</span><h1>문제를 만들고,<br>교과서에 <em>암호를 숨기다.</em></h1><p>우리 모둠이 삼각비 문제와 교과서 속 글자 위치를 직접 설계합니다. 다른 연구팀은 문제를 풀고 책 속 단서를 찾아 최종 출입문을 열어야 합니다.</p><div class="heroact"><button class="btn primary large" data-go="builder">연구소 제작 시작 →</button><button class="btn large" data-go="gallery">다른 모둠 작품 보기</button><button class="btn large light" data-action="play-sample">샘플 방 탈출 체험</button></div><div class="herostats"><span>모둠별 문제 직접 출제</span><span>교과서 암호 위치 탐색</span><span>작품 교환 및 검증</span></div></div><div class="heropanel"><div class="hero-label"><span>SECURITY RESEARCH FACILITY</span><span>LAB 03 · ACTIVE</span></div>${scene(sampleRoom(),[],false)}<div class="fauxlog"><strong>TEXTBOOK CIPHER SYSTEM</strong><span>4 MODULES · READY</span></div></div></section><div class="flowcards"><div class="card flowcard"><small>01 / DESIGN</small><h3>문제 출제</h3><p>삼각비 문제와 정답, 풀이 및 힌트를 직접 작성</p></div><div class="card flowcard"><small>02 / LOCATE</small><h3>교과서 암호 설계</h3><p>최종 암호를 정하고 각 글자의 페이지·줄·글자 위치 조사</p></div><div class="card flowcard"><small>03 / EXCHANGE</small><h3>연구소 공유</h3><p>완성한 작품을 갤러리에 올리거나 파일·링크로 교환</p></div><div class="card flowcard"><small>04 / ESCAPE</small><h3>다른 모둠 탈출</h3><p>삼각비로 잠금 해제 → 책에서 글자 발견 → 최종 암호 입력</p></div></div><div class="infobar"><div><strong>교과서 암호 규칙을 통일하세요.</strong><p>본문을 위에서부터 세며, 공백·문장부호를 제외하고 한 글자씩 셉니다. 제목·쪽번호·표·그림은 줄 수에서 제외합니다.</p></div><button class="btn small" data-action="help">제작 안내</button></div></div>`}
function builder(){const d=state.draft,p=d.puzzles[state.edit]||d.puzzles[0],err=issues(d),step=d.puzzles.map(p=>!!(p.prompt&&p.answer&&p.letter&&p.page&&p.line&&p.index));const prog=step.filter(Boolean).length;return `<div class="wrap section"><div class="pagehead"><div><span class="eyebrow">LABORATORY AUTHORING SYSTEM</span><h1>교과서 암호 연구소 제작</h1><p>삼각비 문제를 만들고 실제 교과서를 조사하여, 다른 모둠이 찾을 암호의 위치를 입력하세요.</p></div><span class="pill neutral">임시 저장 자동 적용 · 장치 ${d.puzzles.length}개</span></div><div class="grid2"><div><section class="card pad"><div class="boxhead"><h2>01. 연구소 기본 정보</h2><span class="badge-index">01</span></div><div class="formgrid"><div class="field"><label>제작 모둠 *</label><input class="input" maxlength="40" data-field="team" value="${esc(d.team)}" placeholder="예: 3학년 2반 4모둠"></div><div class="field"><label>연구소 이름 *</label><input class="input" maxlength="65" data-field="name" value="${esc(d.name)}" placeholder="예: 삼각비 보안 연구소"></div><div class="field"><label>수학 교과서 이름 *</label><input class="input" maxlength="100" data-field="book" value="${esc(d.book)}" placeholder="예: 중학교 수학 3"></div><div class="field"><label>출판사 / 판본 (선택)</label><input class="input" maxlength="100" data-field="publisher" value="${esc(d.publisher)}" placeholder="예: ○○출판사 / 2022 개정"></div></div><div class="field"><label>연구소 스토리</label><textarea class="textarea" maxlength="450" data-field="story">${esc(d.story)}</textarea></div><div class="field"><label>최종 탈출 암호 * <span class="muted tiny">(장치 수와 글자 수 동일 · 공백 없이)</span></label><input class="input" maxlength="5" data-field="password" value="${esc(d.password)}" placeholder="예: 문을열어"><small>먼저 암호를 정한 다음, 그 글자가 실제 교과서 어디에 있는지 모둠원이 직접 찾습니다. 제작한 암호는 플레이어에게 미리 보이지 않습니다.</small></div><div class="notebox"><b>교과서 단서 작성 규칙</b><br>해당 페이지의 <b>본문</b>에서 위에서부터 줄을 세고, 한 줄 안에서는 <b>공백과 문장부호를 제외</b>하고 글자 번호를 셉니다. 제목·표·그림·쪽번호는 제외합니다. 실제 위치는 제작 모둠이 직접 확인해야 합니다.</div></section><section class="card pad" style="margin-top:18px"><div class="boxhead"><h2>02. 삼각비 문제 및 교과서 단서</h2><span class="badge-index">02</span></div><p class="tiny muted">각 장치마다 문제를 한 개씩 출제합니다. 문제를 맞힌 친구에게 <b>해당 글자의 위치만</b> 공개됩니다.</p><div class="tabstrip">${d.puzzles.map((v,i)=>`<button class="${i===state.edit?'active':''}" data-action="edit-tab" data-i="${i}">${i+1} · ${esc(TYPES[v.object]?.[0]||'장치')} ${step[i]?'✓':''}</button>`).join('')}</div><div class="problem-part"><div class="labelrow"><h3>${state.edit+1}번 보안 장치 설정</h3><div class="btnrow"><button class="btn small" data-action="move-puzzle" data-dir="-1" ${state.edit===0?'disabled':''}>← 순서</button><button class="btn small" data-action="move-puzzle" data-dir="1" ${state.edit===d.puzzles.length-1?'disabled':''}>순서 →</button></div></div><div class="formgrid"><div class="field"><label>문제를 숨길 연구소 물체</label><select class="select" data-qfield="object">${Object.keys(TYPES).map(k=>`<option value="${k}" ${p.object===k?'selected':''}>${TYPES[k][0]}</option>`).join('')}</select></div><div class="field"><label>장치 이름</label><input class="input" data-qfield="title" maxlength="60" value="${esc(p.title)}" placeholder="장치의 이름"></div><div class="field"><label>출제 방식</label><select class="select" data-qfield="type"><option value="short" ${p.type==='short'?'selected':''}>단답형</option><option value="choice" ${p.type==='choice'?'selected':''}>4지선다형</option></select></div><div class="field"><label>정답 (여러 표현은 | 로 구분)</label><input class="input" data-qfield="answer" maxlength="100" value="${esc(p.answer)}" placeholder="예: 1/2 | 0.5"></div></div><div class="field"><label>삼각비 문제 *</label><textarea class="textarea" data-qfield="prompt" maxlength="900" placeholder="예: ∠C=90°, AB=10cm, ∠A=30°일 때 BC의 길이를 구하시오.">${esc(p.prompt)}</textarea></div><div class="field"><label>직각삼각형 그림</label><select class="select" data-qfield="diagram"><option value="false" ${p.diagram?'':'selected'}>그림 없이 출제</option><option value="true" ${p.diagram?'selected':''}>그림 표시</option></select></div>${p.diagram?`<div class="formgrid"><div class="field"><label>∠A 크기</label><select class="select" data-qfield="angle">${[30,45,60].map(a=>`<option value="${a}" ${Number(p.angle)===a?'selected':''}>${a}°</option>`).join('')}</select></div><div class="field"><label>이웃변 AB의 표시</label><input class="input" data-qfield="sideA" maxlength="25" value="${esc(p.sideA||'')}"></div><div class="field"><label>대변 BC의 표시</label><input class="input" data-qfield="sideB" maxlength="25" value="${esc(p.sideB||'')}"></div><div class="field"><label>빗변 AC의 표시</label><input class="input" data-qfield="sideC" maxlength="25" value="${esc(p.sideC||'')}"></div></div>${triangle(p)}`:''}<div class="${p.type==='choice'?'':'hide'}" id="optionFields"><div class="formgrid">${p.choices.map((v,i)=>`<div class="field"><label>보기 ${i+1}</label><input class="input" data-opt="${i}" maxlength="120" value="${esc(v)}"></div>`).join('')}</div></div><div class="field"><label>힌트 (선택)</label><input class="input" maxlength="260" data-qfield="hint" value="${esc(p.hint)}" placeholder="예: sin 30°를 먼저 생각해 보세요."></div><div class="field"><label>해설 (정답 확인 후 공개)</label><textarea class="textarea" maxlength="700" data-qfield="solution" placeholder="풀이 과정과 적용한 삼각비를 적어 주세요.">${esc(p.solution)}</textarea></div></div><div class="problem-part" style="margin-top:13px;border-color:#bedfda;background:#f2f9f7"><div class="labelrow"><h3>교과서 암호 위치 등록</h3><span class="pill">문제 해결 후 공개할 단서</span></div><div class="coord"><div class="field"><label>페이지</label><input class="input" data-qfield="page" inputmode="numeric" type="number" min="1" max="9999" value="${esc(p.page)}" placeholder="예: 153"></div><div class="field"><label>위에서 몇 번째 줄</label><input class="input" data-qfield="line" inputmode="numeric" type="number" min="1" max="200" value="${esc(p.line)}" placeholder="예: 7"></div><div class="field"><label>줄에서 몇 번째 글자</label><input class="input" data-qfield="index" inputmode="numeric" type="number" min="1" max="250" value="${esc(p.index)}" placeholder="예: 4"></div><div class="field"><label>그 위치의 글자 *</label><input class="input" data-qfield="letter" maxlength="2" value="${esc(p.letter)}" placeholder="예: 문"><small>제작자만 입력 · 플레이 시 숨김</small></div></div><div class="notebox">지금 입력하는 위치는 <b>실제 교과서에서 모둠이 직접 확인</b>한 값이어야 합니다. 웹사이트는 교과서 내용을 자동으로 확인하지 않습니다.</div></div><div class="btnrow" style="margin-top:14px;justify-content:space-between"><button class="btn small danger" data-action="remove-puzzle" ${d.puzzles.length<=2?'disabled':''}>현재 장치 삭제</button><button class="btn small" data-action="add-puzzle" ${d.puzzles.length>=5?'disabled':''}>+ 새 장치 추가 (최대 5개)</button></div></section></div><aside class="settings"><section class="card pad"><div class="boxhead"><h2>연구소 설계 현황</h2><span class="pill neutral">${prog} / ${d.puzzles.length} 단서 입력</span></div>${scene(d,[],false)}<div class="scenefoot"><span>SECURITY CONTROL PLAN</span><strong>${esc(d.name)}</strong></div><div class="divider"></div><h3 style="font-size:15px">제작 점검</h3><div class="checklist">${[ ['모둠·교과서 설정',!!d.team.trim()&&!!d.book.trim()],['최종 암호 정하기',!!d.password.trim()&&[...d.password].length===d.puzzles.length],['모든 삼각비 문제 입력',d.puzzles.every(p=>p.prompt&&p.answer)],['실제 교과서 위치 기록',d.puzzles.every(p=>p.page&&p.line&&p.index&&p.letter)],['암호와 단서 글자 일치',!!d.password&&d.puzzles.map(p=>p.letter).join('')===d.password] ].map(x=>`<div class="checkrow"><span class="checkmark ${x[1]?'ok':''}">${x[1]?'✓':'–'}</span>${x[0]}</div>`).join('')}</div>${err.length?`<div class="notebox warn" style="margin-top:17px"><strong>게시 전 확인할 항목 ${err.length}개</strong><br>${esc(err[0])}${err.length>1?` 외 ${err.length-1}개`:''}</div>`:`<div class="notebox" style="margin-top:16px">입력 항목이 갖춰졌습니다. 교과서의 실제 글자 위치를 모둠끼리 다시 검증해 주세요.</div>`}<div class="actions"><button class="btn primary" data-action="test-draft">미리 탈출해 보기</button><button class="btn" data-action="publish">갤러리에 게시</button><button class="btn light" data-action="export-draft">작품 파일 저장</button></div><div class="divider"></div><div class="btnrow"><button class="btn small" data-action="import-file">작품 가져오기</button><button class="btn small danger" data-action="reset-draft">새 연구소 만들기</button></div><p class="tiny muted" style="margin:13px 0 0">이 기기에 자동 저장됩니다. 다른 태블릿과 공유하려면 작품 파일을 교환하거나 웹 배포·온라인 갤러리 설정을 사용하세요.</p></section></aside></div></div>`}
function gallery(){const list=displayed().filter(x=>`${x.room.name} ${x.room.team} ${x.room.book}`.toLowerCase().includes(state.filter.toLowerCase()));return `<div class="wrap section"><div class="pagehead"><div><span class="eyebrow">CLASSROOM LAB ARCHIVE</span><h1>우리 반 연구소 갤러리</h1><p>다른 모둠이 출제한 삼각비 문제를 해결하고, 교과서에서 암호를 찾아보세요.</p></div><button class="btn primary" data-go="builder">+ 연구소 제작</button></div><div class="notebox ${state.onlineActive?'':'warn'}" style="margin-bottom:20px"><b>${state.onlineActive?'온라인 공유 연결됨':'현재는 기기별 로컬 갤러리입니다.'}</b><br>${state.onlineActive?'동일한 Firebase 프로젝트에 게시된 연구소가 모든 접속 기기에 표시됩니다. 학생 실명과 개인정보는 입력하지 마세요.':'다른 태블릿에 작품이 자동으로 나타나지는 않습니다. 아래 작품 파일 가져오기 또는 웹사이트 배포 후 공유 링크를 이용할 수 있습니다. 실시간 학급 갤러리는 교사가 Firebase를 설정하면 사용할 수 있습니다.'}</div><div class="btnrow" style="margin-bottom:19px"><input class="input" style="max-width:350px" id="gallery-filter" placeholder="모둠·연구소·교과서 검색" value="${esc(state.filter)}"><button class="btn" data-action="import-file">작품 파일 가져오기</button><button class="btn" data-action="import-code">작품 공유 코드 입력</button><button class="btn" data-action="online-guide">공유 방법</button></div>${list.length?`<div class="gallery-grid">${list.map(entry=>`<div class="card gallery-card"><div class="gallery-art">${scene(entry.room,[],false)}</div><div class="gallery-body"><div class="gallery-head"><span class="pill neutral">${esc(entry.room.team)}</span><span class="tiny muted">${entry.room.puzzles.length} 장치 · ${entry.source==='online'?'온라인':'저장됨'}</span></div><h3>${esc(entry.room.name)}</h3><p>${esc(entry.room.story).slice(0,110)}</p><div class="gallery-actions"><button class="btn small primary" data-action="play-entry" data-id="${esc(entry.room.id)}">탈출 도전</button><button class="btn small" data-action="detail-entry" data-id="${esc(entry.room.id)}">작품·피드백</button></div></div></div>`).join('')}</div>`:`<div class="empty"><h3>등록된 연구소가 없습니다.</h3><p>첫 번째 방탈출을 제작하거나 다른 모둠이 공유한 작품 파일을 가져오세요.</p><div class="btnrow" style="justify-content:center"><button class="btn primary" data-go="builder">첫 작품 제작</button><button class="btn" data-action="play-sample">샘플 체험</button></div></div>`}</div>`}
function playPage(){const s=state.play,d=s.room,n=s.solved.size;return `<div class="wrap section"><div class="pagehead"><div><span class="eyebrow">ESCAPE CHALLENGE · BOOK CIPHER</span><h1>${esc(d.name)}</h1><p>${esc(d.team)} 제작 · 출처: ${esc(d.book)}${d.publisher?' · '+esc(d.publisher):''}</p></div><div class="btnrow"><button class="btn" data-action="reset-play">처음부터</button><button class="btn" data-go="gallery">갤러리로</button></div></div><div class="playgrid"><div><section class="card pad"><div class="boxhead"><h2>보안 연구소 탐색</h2><span class="pill">해제한 장치 ${n} / ${d.puzzles.length}</span></div>${scene(d,[...s.solved])}<div class="scenefoot"><span>장치를 눌러 삼각비 문제를 해결하세요.</span><strong>${n===d.puzzles.length?'최종 인증 가능':'SECURITY ACTIVE'}</strong></div><div class="progress"><span style="width:${Math.round(100*n/d.puzzles.length)}%"></span></div><div class="roomnote">${esc(d.story)}</div>${d.sample?`<div class="actions"><button class="btn light" data-action="sample-book">데모 연구 자료집 열기</button><span class="tipline">샘플 연구소는 실제 교과서 대신 제공된 연구 자료집을 사용합니다.</span></div>`:''}</section></div><aside><div class="card pad"><div class="boxhead"><h2>교과서 암호 기록함</h2><span class="pill neutral">${n}/${d.puzzles.length} 단서</span></div><p class="tiny muted" style="margin-top:-4px">문제를 해결하면 <b>교과서 위치</b>가 공개됩니다. 책을 찾아보고 글자는 직접 입력하세요.</p><div class="journal-list">${d.puzzles.map((p,i)=>`<div class="journal-entry ${s.solved.has(i)?'got':''}"><div class="entrytop"><span>DATA ${String(i+1).padStart(2,'0')} · ${esc(TYPES[p.object][0])}</span><span>${s.solved.has(i)?'UNLOCKED':'LOCKED'}</span></div>${s.solved.has(i)?`<p><b>${esc(p.page)}쪽 · ${esc(p.line)}번째 줄 · ${esc(p.index)}번째 글자</b></p><div style="display:flex;align-items:center;gap:9px"><input class="charinput" maxlength="2" data-found="${i}" value="${esc(s.found[i]||'')}" aria-label="${i+1}번 교과서에서 찾은 글자"><span class="tiny muted">교과서에서 찾은 글자</span></div>`:`<p>보안 장치를 먼저 해제하세요.</p>`}</div>`).join('')}</div><div class="divider"></div><h3 style="font-size:16px;margin-bottom:5px">최종 출입문 암호</h3><div class="letterboxes">${d.puzzles.map((_,i)=>`<div class="letterbox">${esc(s.found[i]||'?')}</div>`).join('')}</div><div class="field"><label>글자를 순서대로 이어 입력</label><input id="final-code" class="input" placeholder="탈출 암호" maxlength="12" autocomplete="off"></div><button class="btn primary full" data-action="final-submit">최종 보안 해제</button><div class="tiny muted" style="margin-top:9px">책 없이 추측하지 말고 단서를 모두 확인하세요.</div></div></aside></div></div>`}
function modal(title,body){return `<div class="modalback" data-action="close-outside"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialoghead"><h2>${title}</h2><button class="iconbtn" aria-label="닫기" data-action="close-modal">×</button></div><div class="dialogbody">${body}</div></div></div>`}
function modalHtml(){if(!state.modal)return '';const m=state.modal,play=state.play,d=play?.room;switch(m.type){case 'connection-status':return connectionModal();case 'puzzle':{const p=d.puzzles[m.i];const isChoice=p.type==='choice';return modal('SECURITY MODULE · '+esc(p.title),`<span class="pill">${m.i+1} / ${d.puzzles.length} · ${esc(TYPES[p.object][0])}</span><h3 style="margin:16px 0 8px">보안 알고리즘 해독</h3><div class="puzzletext">${esc(p.prompt)}</div>${triangle(p)}<div id="answer-message" style="margin:12px 0"></div>${isChoice?`<div class="choices">${p.choices.map((a,i)=>`<button data-action="choose-answer" data-v="${i}" class="${m.choice===i?'selected':''}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div>`:`<div class="formgrid" style="margin-top:14px"><input id="answer-input" class="input" placeholder="정답 입력 (예: √3/2 또는 1/2)" autocomplete="off"><button class="btn primary" data-action="submit-answer">보안 장치 해제</button></div>`}<div class="actions" style="justify-content:${isChoice?'space-between':'flex-start'}"><button class="btn small light" data-action="reveal-hint">힌트 보기</button>${isChoice?'<button class="btn primary" data-action="submit-answer">선택한 답 제출</button>':''}</div><div id="hint-slot"></div><p class="tipline" style="margin-top:14px">모둠원이 풀이 과정을 설명하고 합의한 뒤 제출하세요.</p>`)}case 'clue':{const p=d.puzzles[m.i];return modal('DATA '+String(m.i+1).padStart(2,'0')+' · 교과서 단서 획득',`<div class="notebox"><b>보안 장치 해제 성공!</b> 정답을 확인했습니다. 이제 교과서에서 암호 글자를 찾아야 합니다.</div><div class="coord" style="margin:18px 0;grid-template-columns:repeat(3,1fr)"><div class="coordbox"><b>${esc(p.page)}</b><span>페이지</span></div><div class="coordbox"><b>${esc(p.line)}</b><span>번째 줄</span></div><div class="coordbox"><b>${esc(p.index)}</b><span>번째 글자</span></div></div><h3 style="font-size:15px">제작 모둠의 해설</h3><div class="roomnote" style="white-space:pre-wrap">${esc(p.solution||'해설이 작성되지 않았습니다.')}</div><p class="tiny muted" style="margin-top:12px">글자는 화면에 나타나지 않습니다. <b>${esc(d.boo on class="btn primary" data-action="play-entry" data-id="${esc(room.id)}">이 연구소 탈출 도전</button><button class="btn" data-action="export-entry" data-id="${esc(room.id)}">작품 파일</button><button class="btn" data-action="share-entry" data-id="${esc(room.id)}">공유 코드·링크</button></div><div class="divider"></div><h3 style="font-size:16px">모둠별 피드백</h3>${notes.length?notes.slice(-10).reverse().map(x=>`<div class="roomnote"><b>${esc(x.team)}</b><br>${esc(x.text)}</div>`).join(''):'<p class="muted smalltxt">아직 작성된 피드백이 없습니다.</p>'}<div class="field" style="margin-top:16px"><label>피드백 작성 모둠</label><input id="fb-team" class="input" maxlength="40" placeholder="예: 2반 3모둠"></div><div class="field"><label>수학적으로 잘 설계한 점과 개선하면 좋을 점</label><textarea id="fb-text" class="textarea" maxlength="300" placeholder="예: 교과서 위치가 정확했어요. 문제에 각도 조건을 더 분명히 적으면 좋겠어요."></textarea></div><button class="btn primary" data-action="submit-feedback">피드백 등록</button>`)}case 'feedback':return modal('제작 모둠에 피드백 남기기',`<p class="smalltxt muted">직접 풀어 보고 좋았던 점과 수정이 필요한 점을 적어 보세요.</p><div class="field"><label>작성 모둠</label><input id="fb-team" class="input" maxlength="40" placeholder="예: 2반 3모둠"></div><div class="field"><label>탐구 과정에서 발견한 내용</label><textarea id="fb-text" class="textarea" maxlength="300" placeholder="예: sin 30° 문제를 해결한 뒤 교과서에서 글자를 찾는 과정이 좋았어요."></textarea></div><button class="btn primary" data-action="submit-feedback">피드백 등록</button>`);case 'import-code':return modal('작품 공유 코드 가져오기',`<p class="smalltxt muted">다른 모둠이 보낸 <b>작품 코드</b>를 붙여 넣으세요. 교사가 배포한 사이트 링크에 작품 데이터가 포함된 경우 링크 자체로도 열 수 있습니다.</p><div class="field"><label>작품 코드 또는 공유 링크</label><textarea id="import-code" class="textarea sharetextarea" placeholder="TRIGLAB2:..."></textarea></div><button class="btn primary" data-action="accept-code">연구소 가져오기</button>`);case 'share':return modal('방탈출 작품 공유',`<div class="notebox"><b>공유 코드</b>는 작품의 문제·정답·암호를 함께 담고 있습니다. 플레이 전에 코드 내용을 직접 열람하지 않도록 해 주세요.</div><div class="field" style="margin-top:15px"><label>공유 코드</label><textarea id="sharecode" class="textarea sharetextarea" readonly>${esc(m.code)}</textarea></div><div class="btnrow"><button class="btn primary" data-action="copy-code">코드 복사</button><button class="btn" data-action="copy-link">작품 링크 복사</button><button class="btn" data-action="export-room">파일 다운로드</button></div><p class="tiny muted" style="margin-top:13px">공유 링크는 웹사이트가 <b>GitHub Pages 등 공개 주소에 배포되어 있을 때</b> 다른 태블릿에서도 열립니다. 파일로 열었다면 JSON 파일을 전달하세요.</p>`);case 'help':return modal('TRIG LAB 제작·수업 안내',`<ol class="smalltxt"><li><b>암호 정하기:</b> 모둠별로 2~5글자 암호를 정합니다.</li><li><b>교과서 탐색:</b> 암호의 글자가 교과서 본문에서 어느 페이지, 어느 줄, 몇 번째 글자인지 실제 책을 보고 찾습니다.</li><li><b>문제 출제:</b> 각 글자에 맞춰 삼각비 문제·정답·힌트·해설을 작성합니다.</li><li><b>검증:</b> 출제 모둠이 먼저 정답과 글자 위치를 확인하고, 다른 모둠이 풀어 봅니다.</li><li><b>탈출:</b> 다른 모둠은 정답을 맞힌 뒤 공개된 <b>위치만</b> 보고 교과서에서 글자를 찾아 암호를 조합합니다.</li></ol><div class="notebox warn">동일 교과서·판본을 사용하고, 본문 줄 세기 및 공백/문장부호 제외 규칙을 통일해야 합니다. 웹사이트는 실제 책을 읽을 수 없으므로 글자 위치의 정확성은 학생이 직접 검증해야 합니다.</div><div class="divider"></div><p class="smalltxt"><b>공유 안내:</b> 같은 태블릿의 갤러리는 자동으로 업데이트됩니다. 여러 태블릿에 공통으로 게시하려면 Firebase 온라인 공유 설정이 필요합니다. 온라인 없이도 JSON 파일이나 공유 코드로 교환할 수 있습니다.</p>`);case 'online-guide':return modal('학급 갤러리 온라인 공유 설정',`<p>이 파일은 서버 없이도 제작·플레이·파일 교환이 가능합니다. 하지만 다른 기기의 갤러리가 자동으로 동기화되지는 않습니다.</p><div class="notebox"><b>실시간 게시판으로 바꾸려면</b><br>Firebase 연결 설정은 적용되어 있습니다. 이 HTML 파일을 <b>index.html</b>이라는 이름으로 GitHub Pages 등 HTTPS 웹 호스팅에 배포하면 됩니다. 상단의 <b>온라인 공유 연결</b> 표시로 접속 상태를 확인하세요.</div><p class="tiny muted" style="margin-top:12px">자세한 과정과 테스트용 보안 규칙은 함께 제공한 README 사용설명서에 있습니다. 작품에는 학생 실명이나 개인정보를 입력하지 않는 것을 권장합니다.</p>`);case 'published':return modal('연구소 등록 완료',`<div class="notebox"><b>${m.postedOnline?'온라인 갤러리에 게시했습니다.':'이 기기의 갤러리에 저장했습니다.'}</b><br>${m.postedOnline?'동일 사이트로 접속한 다른 태블릿에서도 작품을 볼 수 있습니다.':'다른 태블릿에는 아직 공유되지 않았습니다. 온라인 연결 상태를 확인하거나 아래 버튼으로 공유하세요.'}</div><div class="btnrow" style="margin-top:18px"><button class="btn primary" data-go="gallery">갤러리 보기</button><button class="btn" data-action="share-draft">공유 코드·링크</button><button class="btn" data-action="export-draft">작품 파일 저장</button></div>`);default:return ''}}
function render(){const page=state.page==='builder'?builder():state.page==='gallery'?gallery():state.page==='play'&&state.play?playPage():home();$('#root').innerHTML=header()+`<main class="main">${page}</main><footer class="wrap footer">TRIG LAB · TEXTBOOK CIPHER PROJECT · 중3 삼각비 협력 탐구 · 학생 실명 대신 모둠 이름 사용</footer>`+modalHtml()}
function goto(page){state.modal=null;state.page=page;render();window.scrollTo({top:0,behavior:'instant'})}
function inputSync(target){const f=target.dataset.field,q=target.dataset.qfield,opt=target.dataset.opt; if(f){state.draft[f]=target.value;saveDraft()} else if(q){state.draft.puzzles[state.edit][q]=q==='diagram'?target.value==='true':q==='angle'?Number(target.value):target.value;saveDraft();if(['type','object','diagram','angle'].includes(q)){render()}} else if(opt!==undefined){state.draft.puzzles[state.edit].choices[Number(opt)]=target.value;saveDraft()} else if(target.id==='gallery-filter'){state.filter=target.value;const pos=target.selectionStart;render();const input=$('#gallery-filter');input?.focus();input?.setSelectionRange(pos,pos)} else if(target.dataset.found!==undefined&&state.play){state.play.found[Number(target.dataset.found)]=[...target.value].slice(0,1).join('');const field=target.dataset.found;const selection=document.activeElement; // update preview boxes without losing input focus
$$('.letterbox')[Number(field)].textContent=state.play.found[Number(field)]||'?';}}
function answerNorm(x){return String(x??'').normalize('NFKC').toLowerCase().replace(/\\sqrt\{([^}]+)\}/g,'√$1').replace(/sqrt\s*\(([^)]+)\)/g,'√$1').replace(/sqrt\s*/g,'√').replace(/루트/g,'√').replace(/[\s°,㎝]/g,'').replace(/\*/g,'×').replace(/[()]/g,'').replace(/\.$/,'')}
function correct(user,answer){let u=answerNorm(user);return String(answer??'').split('|').some(a=>{let t=answerNorm(a);if(u===t)return true;let x=Number(u),y=Number(t);return u!==''&&t!==''&&Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<1e-8})}
function start(room,entry=null){if(!validRoom(room)){showToast('작품 데이터가 올바르지 않습니다.');return}state.play={room:clone(room),solved:new Set(),found:Array(room.puzzles.length).fill(''),choice:null,entry};goto('play')}
function getEntry(q){return displayed().find(x=>x.room.id===q)}
function puzzleOpen(index){if(!state.play)return; if(state.play.solved.has(index)){state.modal={type:'clue',i:index};render();return}state.modal={type:'puzzle',i:index,choice:null};render()}
function attempt(){const m=state.modal,p=state.play.room.puzzles[m.i],chosen=p.type==='choice'?p.choices[m.choice]:$('#answer-input')?.value;if(!chosen){showToast('정답을 선택하거나 입력하세요.');return}if(correct(chosen,p.answer)){state.play.solved.add(m.i);state.modal={type:'clue',i:m.i};render()}else{$('#answer-message').innerHTML='<div class="notebox error">보안 인증 실패. 모둠원과 풀이를 다시 검토해 보세요.</div>'}}
function finalCheck(){if(!state.play)return;const code=String($('#final-code')?.value||'').replace(/\s/g,'');if(state.play.solved.size!==state.play.room.puzzles.length){showToast('보안 장치를 모두 해결해야 탈출할 수 있습니다.');return}if(state.play.found.some(x=>!x)){showToast('교과서에서 모든 글자를 찾아 기록함에 입력하세요.');return}if(state.play.found.join('')!==code){showToast('기록한 글자와 입력한 암호가 다릅니다. 순서를 확인하세요.');return}if(code===state.play.room.password){state.modal={type:'win'};render()}else{showToast('최종 암호가 일치하지 않습니다. 교과서 위치를 다시 확인하세요.')}}
function cleanRoom(d){const v=clone(d);v.team=v.team.trim();v.name=v.name.trim();v.book=v.book.trim();v.password=v.password.trim();v.puzzles.forEach(p=>{p.prompt=p.prompt.trim();p.answer=p.answer.trim();p.letter=p.letter.trim();p.page=Number(p.page);p.line=Number(p.line);p.index=Number(p.index)});v.createdAt=Date.now();if(issues(v).length)throw new Error(issues(v)[0]);if(!validRoom(v))throw new Error('작품 데이터에 잘못된 입력이 있습니다.');return v}
function downloaded(room){const content=JSON.stringify({format:'TRIG_TEXTBOOK_CIPHER_V2',room},null,2);const blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=('TRIG_LAB_'+room.team+'_'+room.name).replace(/[\\/:*?"<>|]/g,'_').slice(0,85)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function putLocal(room){const old=state.local.filter(x=>x.room.id!==room.id);old.unshift({room,createdAt:Date.now()});state.local=old.slice(0,120);store(GK,state.local)}
async function publish(){let v;try{v=cleanRoom(state.draft)}catch(e){showToast(e.message);return}v.id=id();state.draft.id=v.id;saveDraft();putLocal(v);let postedOnline=false;if(state.onlineActive&&state.fb){try{await state.fb.addRoom(v);postedOnline=true}catch(e){console.warn(e);showToast('기기에 저장했지만 온라인 게시에 실패했습니다.')}}state.modal={type:'published',postedOnline};render()}
function b64urlEncode(s){let a=new TextEncoder().encode(s);let t='';for(let x of a)t+=String.fromCharCode(x);return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64urlDecode(s){let raw=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder().decode(Uint8Array.from(raw,ch=>ch.charCodeAt(0)))}
function codeRoom(room){return 'TRIGLAB2:'+b64urlEncode(JSON.stringify({format:'TRIG_TEXTBOOK_CIPHER_V2',room}))}
function decoded(text){let raw=String(text||'').trim(),match=raw.match(/(?:#|\?)room=([^&\s]+)/);if(match)raw='TRIGLAB2:'+decodeURIComponent(match[1]);if(!raw.startsWith('TRIGLAB2:'))throw new Error('올바른 공유 코드 또는 링크가 아닙니다.');const o=JSON.parse(b64urlDecode(raw.slice(9)));if(o.format!=='TRIG_TEXTBOOK_CIPHER_V2'||!validRoom(o.room))throw new Error('지원하지 않는 작품 데이터입니다.');return o.room}
function accepted(room,intoDraft=false){if(!validRoom(room))throw Error('작품 데이터가 올바르지 않습니다.');if(intoDraft){state.draft=clone(room);state.edit=0;saveDraft();goto('builder')}else{putLocal(room);goto('gallery');showToast('새 연구소를 갤러리에 가져왔습니다.')}}
function importFile(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{if(!input.files?.[0])return;try{const data=JSON.parse(await input.files[0].text());if(data.format!=='TRIG_TEXTBOOK_CIPHER_V2')throw Error('지원되지 않는 파일 형식입니다.');accepted(data.room)}catch(e){showToast(e.message||'파일을 읽을 수 없습니다.')}};input.click()}
function feedbackFor(id){return state.feedback[id]||[]}
function getFeedback(id){return feedbackFor(id)}
async function submitFeedback(){const room=state.modal?.entry?.room||state.play?.room;if(!room)return;const team=$('#fb-team')?.value.trim(),message=$('#fb-text')?.value.trim();if(!team||!message){showToast('모둠 이름과 피드백을 모두 입력하세요.');return}if(message.length>300)return;const record={team:team.slice(0,40),text:message.slice(0,300),at:Date.now()};const arr=feedbackFor(room.id);arr.push(record);state.feedback[room.id]=arr.slice(-35);store(FK,state.feedback);if(state.onlineActive&&state.fb){try{await state.fb.addFeedback(room.id,record)}catch(e){console.warn('Online feedback unavailable',e)}}showToast('피드백을 남겼습니다.');state.modal={type:'detail',entry:state.play?.entry||getEntry(room.id)||{room}};render()}
async function clipboard(v){try{await navigator.clipboard.writeText(v);showToast('클립보드에 복사했습니다.')}catch{const x=$('#sharecode');if(x){x.focus();x.select();showToast('텍스트가 선택되었습니다. 복사해 주세요.')}else showToast('브라우저에서 복사가 제한됩니다.')}}
function linkFor(code){const base=location.href.split('#')[0];return base+'#room='+encodeURIComponent(code.slice(9))}
async function doAction(e){const btn=e.target.closest('[data-action],[data-go]');if(!btn)return;if(btn.closest('.modalback')&&btn.dataset.action==='close-outside'&&e.target!==btn)return;if(btn.dataset.go){e.preventDefault();goto(btn.dataset.go);return}const a=btn.dataset.action;switch(a){case 'noop':return;case 'connection-status':state.modal={type:'connection-status'};render();return;case 'retry-firebase':state.modal=null;initFirebase();return;case 'inspect':{if(state.page!=='play')return;const k=btn.dataset.kind,i=state.play.room.puzzles.findIndex(x=>x.object===k);if(i>=0)puzzleOpen(i);else {showToast(TYPES[k][0]+'에 별도 보안 장치가 없습니다.')}return}case 'door':if(state.page==='play'){if(state.play.solved.size===state.play.room.puzzles.length){$('#final-code')?.focus();showToast('모든 보안 장치가 열렸습니다. 교과서 암호를 입력하세요.')}else{state.modal={type:'door'};render()}}return;case 'play-sample':start(sampleRoom());return;case 'sample-book':state.modal={type:'sample-book'};render();return;case 'edit-tab':state.edit=Number(btn.dataset.i);render();return;case 'add-puzzle':{if(state.draft.puzzles.length>=5){showToast('보안 장치는 최대 5개까지입니다.');return}const used=new Set(state.draft.puzzles.map(x=>x.object));const p=blankPuzzle(state.draft.puzzles.length);p.object=Object.keys(TYPES).find(x=>!used.has(x))||p.object;state.draft.puzzles.push(p);state.edit=state.draft.puzzles.length-1;saveDraft();render();return}case 'remove-puzzle':{if(state.draft.puzzles.length<=2)return;state.draft.puzzles.splice(state.edit,1);state.edit=Math.max(0,Math.min(state.edit,state.draft.puzzles.length-1));saveDraft();render();return}case 'move-puzzle':{const i=state.edit,j=i+Number(btn.dataset.dir);if(j<0||j>=state.draft.puzzles.length)return;const arr=state.draft.puzzles;[arr[i],arr[j]]=[arr[j],arr[i]];state.edit=j;saveDraft();render();return}case 'reset-draft':{if(!confirm('현재 작성한 연구소를 초기화하고 새 연구소를 만드시겠습니까? 먼저 작품 파일 저장을 권장합니다.'))return;state.draft=newDraft();state.edit=0;saveDraft();render();return}case 'test-draft':{try{start(cleanRoom(state.draft))}catch(err){showToast('테스트 전: '+err.message)}return}case 'publish':await publish();return;case 'export-draft':{try{downloaded(cleanRoom(state.draft))}catch(e){showToast(e.message)}return}case 'import-file':importFile();return;case 'import-code':state.modal={type:'import-code'};render();return;case 'accept-code':{try{accepted(decoded($('#import-code')?.value))}catch(e){showToast(e.message)}return}case 'detail-entry':{const entry=getEntry(btn.dataset.id);if(entry){state.modal={type:'detail',entry};render()}return}case 'play-entry':{const entry=getEntry(btn.dataset.id)||state.modal?.entry;if(entry)start(entry.room,entry);return}case 'export-entry':{const entry=getEntry(btn.dataset.id)||state.modal?.entry;if(entry)downloaded(entry.room);return}case 'share-entry':{const entry=getEntry(btn.dataset.id)||state.modal?.entry;if(entry){state.modal={type:'share',room:entry.room,code:codeRoom(entry.room)};render()}return}case 'share-draft':{try{const room=cleanRoom(state.draft);state.modal={type:'share',room,code:codeRoom(room)};render()}catch(e){showToast(e.message)}return}case 'export-room':downloaded(state.modal.room);return;case 'copy-code':await clipboard(state.modal.code);return;case 'copy-link':await clipboard(linkFor(state.modal.code));return;case 'close-modal':state.modal=null;render();return;case 'close-outside':if(e.target===btn){state.modal=null;render()}return;case 'choose-answer':{state.modal.choice=Number(btn.dataset.v);const selected=state.modal.choice;$$('.choices button').forEach((x,i)=>x.classList.toggle('selected',i===selected));return}case 'submit-answer':attempt();return;case 'reveal-hint':{const p=state.play.room.puzzles[state.modal.i];$('#hint-slot').innerHTML=`<div class="notebox" style="margin-top:11px">${esc(p.hint||'해당 각의 sin, cos, tan의 정의를 떠올려 보세요.')}</div>`;return}case 'final-submit':finalCheck();return;case 'reset-play':{if(confirm('지금까지 모은 단서를 초기화하고 다시 시작할까요?'))start(state.play.room,state.play.entry);return}case 'feedback-open':state.modal={type:'feedback'};render();return;case 'submit-feedback':await submitFeedback();return;case 'help':state.modal={type:'help'};render();return;case 'online-guide':state.modal={type:'online-guide'};render();return;default:return}}
function attach(){document.addEventListener('click',doAction);document.addEventListener('input',e=>{if(e.target.matches('[data-field],[data-qfield],[data-opt],[data-found],#gallery-filter'))inputSync(e.target)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}else if(e.key==='Enter'&&e.target.id==='answer-input'){e.preventDefault();attempt()}else if(e.key==='Enter'&&e.target.id==='final-code'){e.preventDefault();finalCheck()}})}
function connectionAdvice(code,phase){
 const c=String(code||'');
 if(location.protocol==='file:')return '현재 HTML 파일을 직접 열고 있습니다(file://). GitHub Pages에 index.html로 업로드한 뒤 https://로 시작하는 실제 사이트 주소에서 다시 확인하세요.';
 if(c.includes('operation-not-allowed')||c.includes('admin-restricted-operation'))return 'Firebase 콘솔 > 보안 > Authentication > 로그인 방법에서 익명(Anonymous) 로그인 사용 설정을 켜고 저장하세요.';
 if(c.includes('permission-denied'))return 'Firestore Database > 규칙(Rules)에서 trigCipherRooms 컬렉션을 인증 사용자에게 읽기 허용하는 규칙을 게시했는지 확인하세요.';
 if(c.includes('unauthorized-domain'))return 'Firebase 콘솔 > Authentication > 설정 > 승인된 도메인에 접속 중인 사이트의 도메인(예: 사용자명.github.io)을 추가하세요.';
 if(c.includes('invalid-api-key')||c.includes('invalid-app-credential'))return 'Firebase 웹 앱 설정의 apiKey와 프로젝트 ID가 맞는지 확인하세요.';
 if(c.includes('network')||c.includes('unavailable')||c.includes('failed-to-fetch')||c.includes('Failed to fetch'))return '인터넷 연결, 브라우저 추적방지 설정, 학교 네트워크의 Firebase/Google CDN 차단 여부를 확인하세요. 다른 네트워크로도 시험해 보세요.';
 if(c.includes('unsupported'))return '브라우저 저장소가 차단되었을 수 있습니다. 일반 크롬/엣지 창에서 https:// 웹 주소로 열어 보세요.';
 if(phase==='Firebase 라이브러리 다운로드')return 'Firebase JavaScript 모듈을 다운로드하지 못했습니다. 인터넷 연결 또는 www.gstatic.com 접근 제한을 확인하세요.';
 return '아래 오류 코드와 메시지를 확인하고, Firebase 익명 인증 및 Firestore 규칙을 확인하세요. GitHub Pages를 사용 중이면 최신 index.html이 배포되었는지도 확인하세요.';
}
function connectionModal(){
 const place=location.protocol==='file:'?'내 컴퓨터의 HTML 파일':location.protocol==='https:'?'HTTPS 웹사이트':location.protocol+' 주소';
 const status=state.onlineActive?'온라인 공유 연결 성공':state.fbStatus==='error'?'연결 실패':'연결을 시도하는 중';
 const problem=state.fbStatus==='error'?`<div class="notebox error" style="margin-top:13px"><b>오류 코드:</b> ${esc(state.fbErrorCode||'코드 없음')}<br><b>상세:</b> ${esc(state.fbError||'알 수 없는 오류')}</div>`:'';
 return modal('Firebase 연결 진단',`<p><b>현재 상태:</b> ${esc(status)}</p><p class="smalltxt"><b>진행 단계:</b> ${esc(state.fbPhase)}<br><b>접속 방식:</b> ${esc(place)}<br><b>Firebase 프로젝트:</b> trig-lab</p>${problem}<div class="notebox ${state.onlineActive?'':'warn'}" style="margin-top:14px"><b>${state.onlineActive?'모둠 작품을 온라인으로 공유할 수 있습니다.':'확인할 사항'}</b><p style="margin:6px 0 0">${esc(state.onlineActive?'다른 태블릿에서도 같은 웹사이트 주소로 접속해 모둠 작품이 나타나는지 확인하세요.':connectionAdvice(state.fbErrorCode||state.fbError,state.fbPhase))}</p></div><div class="btnrow" style="margin-top:18px"><button class="btn primary" data-action="retry-firebase">다시 연결하기</button><button class="btn" data-action="close-modal">닫기</button></div><p class="tiny muted" style="margin-top:14px">Firebase 접속 오류는 사이트 제작물과 별개로 인증·네트워크·보안규칙 문제일 수 있습니다. 개인 정보는 게시하지 마세요.</p>`);
}
async function initFirebase(){
 const c=window.TRIG_LAB_FIREBASE_CONFIG;
 for(const fn of state.fbUnsubs){try{fn()}catch(e){console.warn(e)}}
 state.fbUnsubs=[];
 state.onlineActive=false;
 state.fb=null;
 state.fbStatus='connecting';
 state.fbPhase='Firebase 설정 확인';
 state.fbError='';state.fbErrorCode='';
 render();
 if(!c||!c.apiKey||!c.projectId){
   state.fbStatus='error';state.fbErrorCode='config/missing';state.fbError='웹 앱 설정(firebaseConfig)이 누락되었습니다.';render();return;
 }
 try{
   state.fbPhase='Firebase 라이브러리 다운로드';render();
   const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
   const {getAuth,signInAnonymously}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
   const {getFirestore,collection,addDoc,query,onSnapshot,serverTimestamp}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
   state.fbPhase='익명 로그인 중';render();
   const app=initializeApp(c),auth=getAuth(app);
   const user=await signInAnonymously(auth),db=getFirestore(app);
   state.fbUid=user.user.uid;
   state.fb={addRoom:room=>addDoc(collection(db,'trigCipherRooms'),{room,createdAt:serverTimestamp(),ownerUid:user.user.uid}),addFeedback:(roomId,record)=>addDoc(collection(db,'trigCipherFeedback'),{roomId,...record,createdAt:serverTimestamp(),ownerUid:user.user.uid})};
   state.fbPhase='Firestore 갤러리 읽기 권한 확인';render();
   state.fbUnsubs.push(onSnapshot(query(collection(db,'trigCipherRooms')),snapshot=>{
     state.online=snapshot.docs.map(doc=>({room:doc.data().room,source:'online'})).filter(x=>validRoom(x.room)).slice(0,300);
     state.onlineActive=true;
     state.fbStatus='connected';state.fbPhase='온라인 갤러리 실시간 연결 완료';state.fbError='';state.fbErrorCode='';render();
   },err=>{
     state.onlineActive=false;state.fbStatus='error';state.fbPhase='Firestore 갤러리 읽기 실패';state.fbErrorCode=err.code||'firestore/unknown';state.fbError=err.message||String(err);console.warn('Gallery subscription error',err);render();
   }));
   state.fbUnsubs.push(onSnapshot(query(collection(db,'trigCipherFeedback')),snapshot=>{
     const remote={};for(const doc of snapshot.docs){const f=doc.data();if(!f.roomId||typeof f.team!=='string'||typeof f.text!=='string')continue;(remote[f.roomId]??=[]).push({team:f.team,text:f.text,at:f.at||0});}
     for(const [roomId,items] of Object.entries(remote)){
       const a=state.feedback[roomId]||[];const have=new Set(a.map(x=>[x.team,x.text,x.at].join('|')));
       for(const item of items){const sig=[item.team,item.text,item.at].join('|');if(!have.has(sig)){a.push(item);have.add(sig)}}state.feedback[roomId]=a.slice(-50);
     }
     if(state.modal?.type==='detail')render();
   },err=>console.warn('Feedback subscription error',err)));
 }catch(err){
   console.warn('Firebase not connected',err);state.onlineActive=false;state.fbStatus='error';state.fbErrorCode=err.code||err.name||'firebase/unknown';state.fbError=err.message||String(err);render();
 }
}
function initLink(){const hash=location.hash;const m=hash.match(/^#room=(.+)$/);if(!m)return;try{const room=decoded('TRIGLAB2:'+decodeURIComponent(m[1]));if(!state.local.some(x=>x.room.id===room.id))putLocal(room);start(room,{room,source:'link'});history.replaceState(null,'',location.href.split('#')[0]);}catch(err){console.warn('Invalid room link',err)}}
attach();render();initLink();initFirebase();
})();
</script></body></html>
