 const replaceName=isTemplateRoomName(room.name),replaceStory=isTemplateRoomStory(room.story);
 room.theme=THEMES[nextTheme]?nextTheme:'lab';

};

async function checkTeacherPermission(user){
 const api=state.teacherApi;
 if(!user||!api)return;
 state.teacherStatus='checking';state.teacherUid=user.uid;state.teacherEmail=user.email||'';state.teacherError='';if(state.page==='teacher')render();
 try{
  const snap=await api.getDoc(api.doc(state.teacherDb,'trigCipherAdmins',user.uid));
  if(state.teacherAuth?.currentUser?.uid!==user.uid)return;
  state.teacherStatus=snap.exists()&&snap.data().enabled===true?'approved':'pending';
 }catch(err){if(state.teacherAuth?.currentUser?.uid!==user.uid)return;state.teacherStatus='error';state.teacherError=(err.code||'unknown')+' · '+(err.message||'교사 권한을 확인할 수 없습니다.');}

}
function teacherLogin(){
 const api=state.teacherApi;
 if(!api||!state.teacherAuth){showToast('Firebase 준비 중입니다. 잠시 후 다시 시도하세요.');return}
 const promise=api.signInWithPopup(state.teacherAuth,new api.GoogleAuthProvider());
 state.teacherStatus='checking';render();
 promise.catch(e=>{if(e.code==='auth/popup-closed-by-user'){state.teacherStatus='signed-out';}else{state.teacherStatus='error';state.teacherError=(e.code||'login-error')+' · '+(e.message||'로그인을 확인하세요.')}render();});
}
async function teacherLogout(){if(!state.teacherApi||!state.teacherAuth)return;try{await state.teacherApi.signOut(state.teacherAuth);state.teacherStatus='signed-out';state.teacherUid='';state.teacherEmail='';state.modal=null;render();showToast('교사 계정에서 로그아웃했습니다.')}catch(e){showToast('로그아웃 오류: '+(e.code||e.message))}}
async function teacherDelete(docId){
 if(state.teacherBusy||!teacherAllowed())return;
 const entry=teacherEntry(docId);
 if(!entry){showToast('작품을 찾을 수 없습니다.');return}
 if($('#teacher-delete-verify')?.value.trim()!=='삭제'){showToast('확인을 위해 삭제를 정확히 입력하세요.');return}
 state.teacherBusy=true;render();
 try{
  await state.teacherApi.deleteDoc(state.teacherApi.doc(state.teacherDb,'trigCipherRooms',docId));
  state.online=state.online.filter(e=>e.docId!==docId);
  state.local=state.local.filter(e=>e.room.id!==entry.room.id);
  store(GK,state.local);
  state.teacherBusy=false;state.modal=null;render();showToast('온라인 방탈출을 삭제했습니다.');
 }catch(e){console.warn('Teacher deletion failed',e);state.teacherBusy=false;render();showToast('삭제 실패: '+(e.code||e.message||'관리자 권한과 Firestore 규칙을 확인하세요.'))}
}
function teacherFilterList(v){state.teacherFilter=v;document.querySelectorAll('[data-admin-search]').forEach(el=>el.hidden=!el.dataset.adminSearch.includes(v.toLowerCase().trim()))}
function playPage(){const s=state.play,d=s.room,n=s.solved.size,isNew=isNewRoom(d),clues=revealedClueCount(s),target=neededClues(d);return `<div class="wrap section"><div class="pagehead"><div><span class="eyebrow">ESCAPE CHALLENGE · BOOK CIPHER</span><h1>${esc(roomDisplayName(d))}</h1><p>${esc(d.team)} 제작 · ${esc(themeInfo(d).name)} 테마${d.book?` · 사용 교과서: ${esc(d.book)}`:''}</p></div><div class="btnrow">${s.practice?`<button class="btn" data-action="reset-play">처음부터</button>`:''}<button class="btn" data-go="gallery">갤러리로${s.practice?'':' · 시간 계속'}</button></div></div><div class="timerbanner"><div><span>도전 모둠</span><div><b>${s.practice?'연습 모드':s.teamNo?`${s.teamNo}조`:'모둠 선택 전'}</b></div></div><div><span>탈출까지 걸린 시간</span><div><b id="play-timer">${s.finished?elapsedFormat(s.elapsedMs):s.startedAt!==null?elapsedFormat(Date.now()-s.startedAt):'00:00.00'}</b></div></div><span>${s.practice?'연습 기록은 순위에 포함되지 않아요':'새로고침·재접속해도 기존 기록이 이어지고 시간은 계속 흐릅니다'}</span></div><div class="playgrid"><div><section class="card pad"><div class="boxhead"><h2>${themeInfo(d).name} · 방탈출 탐색</h2><span class="pill">해결한 문제 ${n}/${d.puzzles.length} · 획득한 힌트 ${clues}/${target}</span></div><div class="scene-theme-banner"><span>선택 테마 <b>${themeInfo(d).name}</b></span><span>${themeInfo(d).story}</span></div>${scene(d,[...s.solved])}<div class="scenefoot"><span>장치를 눌러 ${isNew?'삼각비·넌센스':'삼각비'} 문제를 해결하세요.</span><strong>${clues===target?'최종 인증 가능':'SECURITY ACTIVE'}</strong></div><div class="progress"><span style="width:${Math.round(100*clues/target)}%"></span></div><div class="roomnote">${esc(roomDisplayStory(d))}</div>${d.sample?`<div class="actions"><button class="btn light" data-action="sample-book">데모 연구 자료집 열기</button><span class="tipline">이 샘플 방탈출은 실제 교과서 대신 제공된 연구 자료집을 사용합니다.</span></div>`:''}</section></div><aside><div class="card pad"><div class="boxhead"><h2>교과서 암호 기록함</h2><span class="pill neutral">${clues}/${target} 힌트</span></div><p class="tiny muted" style="margin-top:-4px">${isNew?'힌트 4개가 어느 문제에 들어 있는지 찾아보세요. 꽝에서는 암호 위치가 나오지 않아요.':'문제를 해결하면 교과서 위치가 공개됩니다.'}</p><div class="journal-list">${isNew?[1,2,3,4].map(slot=>{const ix=d.puzzles.findIndex(p=>p.clueSlot===slot),p=d.puzzles[ix],got=s.solved.has(ix);return `<div class="journal-entry ${got?'got':''}"><div class="entrytop"><span>암호 ${slot}번째 글자</span><span>${got?'HINT ACQUIRED':'LOCKED'}</span></div>${got?`<p><b>${clueBookLabel(p)} · ${esc(p.page)}쪽 · ${esc(p.line)}번째 줄 · ${esc(p.index)}번째 글자</b></p><div class="found-row"><input class="charinput" maxlength="1" data-found="${slot-1}" value="${esc(s.found[slot-1]||'')}" aria-label="암호 ${slot}번째 글자"><span class="tiny muted">교과서에서 찾은 글자</span></div>`:`<p>단서가 숨겨진 문제를 찾아 해결하세요.</p>`}</div>`}).join(''):d.puzzles.map((p,i)=>`<div class="journal-entry ${s.solved.has(i)?'got':''}"><div class="entrytop"><span>DATA ${String(i+1).padStart(2,'0')} · ${esc(objectLabel(d,p.object))}</span><span>${s.solved.has(i)?'UNLOCKED':'LOCKED'}</span></div>${s.solved.has(i)?`<p><b>${clueBookLabel(p)} · ${esc(p.page)}쪽 · ${esc(p.line)}번째 줄 · ${esc(p.index)}번째 글자</b></p><div class="found-row"><input class="charinput" maxlength="1" data-found="${i}" value="${esc(s.found[i]||'')}"></div>`:`<p>보안 장치를 먼저 해제하세요.</p>`}</div>`).join('')}</div><div class="divider"></div><h3 style="font-size:16px;margin-bottom:5px">최종 출입문 암호</h3><div class="letterboxes">${Array.from({length:target},(_,i)=>`<div class="letterbox">${esc(s.found[i]||'?')}</div>`).join('')}</div><div class="field"><label>${isNew?'한글 4글자를':'찾은 글자를'} 순서대로 이어 입력</label><input id="final-code" class="input" placeholder="${isNew?'한글 4글자 입력':'탈출 암호'}" maxlength="${target}" autocomplete="off"></div><button class="btn primary full" data-action="final-submit">최종 보안 해제</button><div class="tiny muted" style="margin-top:9px">${isNew?'4개의 힌트를 모두 획득하면 꽝 문제를 풀지 않아도 탈출할 수 있어요.':'책 없이 추측하지 말고 단서를 모두 확인하세요.'}</div></div><section class="card pad" style="margin-top:14px"><div class="boxhead"><h2>🏆 이 방탈출 순위</h2><span class="pill neutral">모둠별 최고 기록</span></div>${rankingHtml(rankingKey(d))}</section></aside></div></div>`}
function modal(title,body){return `<div class="modalback" data-action="close-outside"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialoghead"><h2>${title}</h2><button class="iconbtn" aria-label="닫기" data-action="close-modal">×</button></div><div class="dialogbody">${body}</div></div></div>`}
function modalHtml(){if(!state.modal)return '';const m=state.modal,play=state.play,d=play?.room;switch(m.type){case 'leaderboard':{const entry=getEntry(m.roomId);return entry?leaderboardModal(entry):modal('방탈출 순위 보기','<p>이 작품은 갤러리에서 삭제되었거나 더 이상 확인할 수 없습니다.</p>')}case 'teacher-detail':return teacherDetailModal(m.docId);case 'teacher-confirm-delete':return teacherDeleteModal(m.docId);case 'confirm-delete':{const entry=getEntry(m.roomId);return modal('방탈출 삭제 확인',`<div class="notebox error"><b>${esc(roomDisplayName(entry?.room||{})||'선택한 방탈출')}</b><br>이 작품을 ${entry?.source==='online'?'온라인 갤러리에서':'이 기기의 갤러리에서'} 삭제합니다. 삭제 후 복구할 수 없습니다.</div><p class="smalltxt muted" style="margin-top:12px">탈출 기록·피드백은 Firebase에 남을 수 있지만, 삭제한 작품은 갤러리에서 선택할 수 없어요. 필요한 경우 먼저 작품 파일을 저장하세요.</p><div class="btnrow" style="margin-top:18px"><button class="btn danger" data-action="confirm-delete" ${state.busy?'disabled':''}>${state.busy?'삭제 중…':'정말 삭제하기'}</button><button class="btn" data-action="close-modal">취소</button></div>`)}case 'connection-status':return connectionModal();case 'riddle-bank':return nonsenseModal();case 'sketch':{const p=state.draft.puzzles[state.edit];return modal('문제 그림 그리기',`<div class="notebox"><b>${state.edit+1}번 문제 그림판</b><br>펜·도형 도구로 그림을 만드세요. <b>● 점 찍기</b>로 삼각형의 변이나 원 위에 정확히 점을 놓고, <b>△ 삼각형</b>으로 그 점을 차례로 선택해 연결하세요. 확대·축소와 화면 이동도 가능합니다.</div><div class="sketch-stage" style="margin-top:14px"><div class="sketch-tools" role="group" aria-label="그림 그리기 도구"><button type="button" class="sketch-tool selected" data-sketch-tool="pen" aria-pressed="true">✏️ 펜</button><button type="button" class="sketch-tool" data-sketch-tool="line" aria-pressed="false">╱ 직선</button><button type="button" class="sketch-tool" data-sketch-tool="circle" aria-pressed="false">◯ 원</button><button type="button" class="sketch-tool" data-sketch-tool="point" aria-pressed="false">● 점 찍기</button><button type="button" class="sketch-tool" data-sketch-tool="triangle" aria-pressed="false">△ 삼각형 (3점)</button><button type="button" class="sketch-tool" data-sketch-tool="right" aria-pressed="false">◺ 직각삼각형</button><button type="button" class="sketch-tool" data-sketch-tool="eraser" aria-pressed="false">⌫ 지우개</button><button type="button" class="sketch-tool" data-sketch-tool="pan" aria-pressed="false">✋ 화면 이동</button></div><div class="sketch-options"><label>선 색상 <input type="color" id="sketch-color" value="#173746" aria-label="펜 색상"></label><label>선 굵기 <select id="sketch-width" aria-label="선 굵기"><option value="2">얇게</option><option value="3" selected>보통</option><option value="6">굵게</option></select></label><span class="sketch-tool-hint" id="sketch-tool-hint" aria-live="polite">펜 · 화면을 따라 자유롭게 그려요.</span></div><div class="sketch-view-controls" role="group" aria-label="그림판 확대 축소"><button type="button" class="btn small" id="sketch-zoom-out" aria-label="축소">− 축소</button><strong id="sketch-zoom-label" aria-live="polite">100%</strong><button type="button" class="btn small" id="sketch-zoom-in" aria-label="확대">＋ 확대</button><button type="button" class="btn small" id="sketch-zoom-reset">100% · 맞춤</button><span>확대한 뒤 ✋ 화면 이동 · PC는 Ctrl+휠</span></div><canvas id="sketch-canvas" width="720" height="420" aria-label="문제 그림판"></canvas><div class="sketch-toolbar"><button type="button" class="btn small" id="sketch-undo" disabled>↶ 실행 취소</button><button type="button" class="btn small" id="sketch-clear-canvas">전체 지우기</button><button type="button" class="btn small primary" id="sketch-save-btn">그림 저장</button><button type="button" class="btn small" data-action="close-modal">닫기</button></div></div>${p.sketch?`<div class="notebox" style="margin-top:14px">현재 저장된 그림을 이어서 편집할 수 있습니다. 그림 저장을 누르면 기존 그림에 덮어써집니다.</div>`:''}`)}case 'start-escape':return modal('방탈출 도전 시작',`<div class="notebox"><b>${esc(roomDisplayName(d))}</b><br>시작 버튼을 누르는 순간부터 최종 암호를 맞힐 때까지 시간을 측정합니다.</div>${play.practice?'<p class="smalltxt muted" style="margin:13px 0">이 도전은 샘플·제작 테스트이므로 순위표에 등록되지 않습니다.</p>':`<div class="field" style="margin-top:14px"><label>체험하는 모둠 번호 (1~30조) *</label><input type="number" class="input" min="1" max="30" step="1" id="start-team" value="${esc(play.teamNo||'')}" placeholder="예: 3" autocomplete="off"></div><p class="tiny muted">학생 이름 대신 모둠 번호만 기록됩니다. 같은 브라우저에서 이 방탈출을 다시 열면 <b>이 모둠의 기존 기록을 이어서</b> 풀게 됩니다. 화면을 닫아도 시간은 계속 흐릅니다.</p>`}<button class="btn primary full" data-action="begin-escape" style="margin-top:14px">${play.practice?'연습 시작':'타이머 시작 · 탈출 도전!'}</button><div class="divider"></div><h3 style="font-size:16px">이 방탈출 현재 순위</h3>${rankingHtml(rankingKey(d))}`);case 'puzzle':{const p=d.puzzles[m.i],isChoice=p.type==='choice',isNew=isNewRoom(d);return modal('ESCAPE MISSION · '+esc(puzzleTitle(p,d)),`<span class="pill">${m.i+1}/${d.puzzles.length} · ${esc(objectLabel(d,p.object))} ${isNew?'· '+(p.kind==='trig'?'삼각비':'넌센스'):''}</span><h3 style="margin:16px 0 8px">${isNew&&p.kind==='nonsense'?'넌센스 수수께끼':'보안 알고리즘 해독'}</h3><div class="puzzletext">${esc(p.prompt)}</div>${triangle(p)}${sketchPreview(p)}${photoPreview(p)}<div id="answer-message" style="margin:12px 0"></div>${isChoice?`<div class="choices">${p.choices.map((a,i)=>`<button data-action="choose-answer" data-v="${i}" class="${m.choice===i?'selected':''}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div>`:`<div class="formgrid" style="margin-top:14px"><input id="answer-input" class="input" placeholder="정답을 입력하세요" autocomplete="off"><button class="btn primary" data-action="submit-answer">정답 제출</button></div>`}<div class="actions" style="justify-content:${isChoice?'space-between':'flex-start'}"><button class="btn small light" data-action="reveal-hint">문제 풀이 도움말</button>${isChoice?'<button class="btn primary" data-action="submit-answer">선택한 답 제출</button>':''}</div><div id="hint-slot"></div><p class="tipline" style="margin-top:14px">정답을 맞히면 힌트가 나올 수도, 꽝이 나올 수도 있습니다.</p>`)}
case 'clue':{const p=d.puzzles[m.i],slot=isNewRoom(d)?Number(p.clueSlot):m.i+1;return modal('🔑 암호 힌트 '+slot+'번 획득',`<div class="notebox"><b>정답! 암호의 ${slot}번째 글자 위치를 찾았습니다.</b><br><strong style="display:inline-block;margin-top:7px;color:var(--teal)">${clueBookLabel(p)}</strong>에서 실제 글자를 찾아 기록함에 적어 주세요.</div><div class="coord" style="margin:18px 0;grid-template-columns:repeat(3,1fr)"><div class="coordbox"><b>${esc(p.page)}</b><span>페이지</span></div><div class="coordbox"><b>${esc(p.line)}</b><span>번째 줄</span></div><div class="coordbox"><b>${esc(p.index)}</b><span>번째 글자</span></div></div>${p.clueText?`<div class="notebox">${esc(p.clueText)}</div>`:''}<h3 style="font-size:15px">제작 모둠의 해설</h3><div class="roomnote" style="white-space:pre-wrap">${esc(p.solution||'작성된 해설이 없습니다.')}</div><p class="tiny muted" style="margin-top:12px">정답 글자는 이 화면에 공개되지 않습니다. <b>${clueBookLabel(p)}</b>${p.clueBook!=='korean'&&d.book?` (${esc(d.book)})`: ''}에서 직접 찾아보세요. 수업에서 정한 교과서 판본을 사용하세요.</p><button class="btn primary full" data-action="close-modal">방탈출로 돌아가기</button>`)}
case 'blank':{const p=d.puzzles[m.i];return modal('꽝! 암호 단서 없음',`<div class="notebox warn"><h2 style="margin:0 0 10px">꽝!</h2><p style="margin:0">${esc(p.decoyMessage||'이번 문제에서는 암호 단서를 얻지 못했습니다.')}</p></div><p class="smalltxt" style="margin-top:13px">정답을 맞힌 것은 성공! 하지만 이 장치에는 한글 암호의 위치 힌트가 없어요. 다른 장치를 계속 조사하세요.</p><div class="roomnote" style="white-space:pre-wrap">${esc(p.solution||'작성된 해설이 없습니다.')}</div><button class="btn primary full" style="margin-top:15px" data-action="close-modal">다른 장치 찾아보기</button>`)}

function inputSync(target){const f=target.dataset.field,q=target.dataset.qfield,opt=target.dataset.opt;if(f){if(f==='theme')updateThemeTitles(state.draft,target.value);else state.draft[f]=target.value;saveDraft();if(f==='theme')render()}else if(q){const p=state.draft.puzzles[state.edit];if(q==='clueSlot'){const previous=Number(p.clueSlot)||0,next=Number(target.value);if(previous!==next){if(next>0){const other=state.draft.puzzles.find((x,i)=>i!==state.edit&&Number(x.clueSlot)===next);if(other)other.clueSlot=previous;}else if(previous>0){const other=state.draft.puzzles.find((x,i)=>i!==state.edit&&Number(x.clueSlot)===0);if(other)other.clueSlot=previous;}p.clueSlot=next;}saveDraft();render();return}if(q==='object'){const oldObject=p.object,wasStock=!p.title||STOCK_TITLES.has(p.title);const other=state.draft.puzzles.find((x,i)=>i!==state.edit&&x.object===target.value);if(other){const otherStock=!other.title||STOCK_TITLES.has(other.title);other.object=oldObject;if(otherStock)other.title=objectInfo(state.draft,oldObject)[1];}if(wasStock)p.title=objectInfo(state.draft,target.value)[1];}p[q]=q==='diagram'?target.value==='true':q==='angle'?Number(target.value):target.value;saveDraft();if(['type','object','diagram','angle'].includes(q))render()}else if(opt!==undefined){state.draft.puzzles[state.edit].choices[Number(opt)]=target.value;saveDraft()}else if(target.id==='gallery-filter'){state.filter=target.value;const pos=target.selectionStart;render();const input=$('#gallery-filter');input?.focus();input?.setSelectionRange(pos,pos)}else if(target.dataset.found!==undefined&&state.play){const index=Number(target.dataset.found);state.play.found[index]=[...target.value].slice(0,1).join('');const node=$$('.letterbox')[index];if(node)node.textContent=state.play.found[index]||'?';persistPlay(true)}}
 
function answerNorm(x){return String(x??'').normalize('NFKC').toLowerCase().replace(/\\sqrt\{([^}]+)\}/g,'√$1').replace(/sqrt\s*\(([^)]+)\)/g,'√$1').replace(/sqrt\s*/g,'√').replace(/루트/g,'√').replace(/[\s°,㎝]/g,'').replace(/\*/g,'×').replace(/[()]/g,'').replace(/\.$/,'')}
function correct(user,answer){let u=answerNorm(user);return String(answer??'').split('|').some(a=>{let t=answerNorm(a);if(u===t)return true;let x=Number(u),y=Number(t);return u!==''&&t!==''&&Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<1e-8})}

// 정식 도전은 작품 버전/모둠별로 기록. 태블릿 같은 브라우저의 영구 저장소 사용.
function attemptKey(room,teamNo){return `${rankingKey(room)}::${Number(teamNo)}`}
function attemptRecords(room){const key=rankingKey(room),data=read(ATK,{});if(!data||typeof data!=='object')return [];return Object.entries(data).filter(([k,r])=>r&&r.roomKey===key&&Number.isInteger(r.teamNo)&&r.teamNo>=1&&r.teamNo<=30&&Number.isFinite(r.startedAt)).map(([k,r])=>({key:k,...r})).sort((a,b)=>b.startedAt-a.startedAt)}
function asAttempt(play){return {roomKey:rankingKey(play.room),teamNo:play.teamNo,startedAt:play.startedAt,solved:[...play.solved].sort((a,b)=>a-b),found:play.found,finished:!!play.finished,elapsedMs:play.elapsedMs,saved:!!play.saved,onlineSaved:!!play.onlineSaved,attemptId:play.attemptId||id()}}
function persistPlay(visible=true){const p=state.play;if(!p||p.practice||!p.teamNo||!Number.isFinite(p.startedAt))return true;
 try{const all=read(ATK,{}),key=attemptKey(p.room,p.teamNo),rec=asAttempt(p);all[key]=rec;localStorage.setItem(ATK,JSON.stringify(all));
 const snapshot={key,room:p.room,entry:p.entry?.docId?{docId:p.entry.docId,source:p.entry.source}:null,visible};
 try{localStorage.setItem(APK,JSON.stringify(snapshot))}catch(e){console.warn('active room snapshot unavailable',e);showToast('저장 공간이 부족해 자동 화면 복원이 어려울 수 있어요.');return false}
 return true}catch(e){console.warn('도전 기록 저장 실패',e);showToast('도전 기록을 저장할 수 없어요. 브라우저 저장 공간을 확인해 주세요.');return false}
}
function recordedPlay(room,entry,rec){
 const solved=new Set(Array.isArray(rec.solved)?rec.solved.filter(i=>Number.isInteger(i)&&i>=0&&i<room.puzzles.length):[]);
 const count=neededClues(room),found=Array.from({length:count},(_,i)=>typeof rec.found?.[i]==='string'?Array.from(rec.found[i]).slice(0,1).join(''):'');
 const ms=Number(rec.startedAt),finished=!!rec.finished;
 if(!Number.isFinite(ms)||ms<=0||ms>Date.now()+60000)return null;
 return {room:clone(room),solved,found,choice:null,entry,practice:false,teamNo:Number(rec.teamNo),startedAt:ms,elapsedMs:finished?Math.max(1000,Number(rec.elapsedMs)||1000):null,finished,saved:!!rec.saved,onlineSaved:!!rec.onlineSaved,attemptId:rec.attemptId||id()}
}
function resumeAttempt(room,entry,rec){const restored=recordedPlay(room,entry,rec);if(!restored)return false;state.play=restored;goto('play');if(restored.finished){state.modal={type:'win'};render()}else{showToast(`${restored.teamNo}조의 진행 상황을 불러왔어요. 이전 시작 시간부터 계속 측정합니다.`)}persistPlay(true);return true}
function restoreActivePlay(){
 const snap=read(APK,null);if(!snap?.visible||!validRoom(snap.room))return false;
 const saved=read(ATK,{}),rec=saved[snap.key];if(!rec||rec.roomKey!==rankingKey(snap.room)||snap.key!==attemptKey(snap.room,rec.teamNo))return false;
 const restored=recordedPlay(snap.room,null,rec);if(!restored)return false;
 state.play=restored;state.page='play';state.modal=restored.finished?{type:'win'}:null;return true
}
function start(room,entry=null,options={}){if(!validRoom(room)){showToast('작품 데이터가 올바르지 않습니다.');return}
 const practice=!!options.practice||!!room.sample;
 if(!practice){const found=attemptRecords(room);if(found.length===1&&resumeAttempt(room,entry,found[0]))return;}
 state.play={room:clone(room),solved:new Set(),found:Array(neededClues(room)).fill(''),choice:null,entry,practice,teamNo:null,startedAt:null,elapsedMs:null,finished:false,saved:false,onlineSaved:false,attemptId:null};goto('play');state.modal={type:'start-escape'};render()}

function puzzleOpen(index){if(!state.play)return;if(state.play.startedAt===null){state.modal={type:'start-escape'};render();return}if(state.play.finished){showToast('이미 탈출을 완료한 모둠입니다. 기존 탈출 기록이 유지됩니다.');return} if(state.play.solved.has(index)){const puzzle=state.play.room.puzzles[index];state.modal={type:isNewRoom(state.play.room)&&!puzzle.clueSlot?'blank':'clue',i:index};render();return}state.modal={type:'puzzle',i:index,choice:null};render()}

function finalCheck(){if(!state.play)return;const code=String($('#final-code')?.value||'').replace(/\s/g,'');const target=neededClues(state.play.room);if(revealedClueCount(state.play)<target){showToast(`힌트 ${target}개를 모두 찾아야 탈출할 수 있어요.`);return}if(state.play.found.some(x=>!x)){showToast('교과서에서 찾은 글자를 기록함에 모두 입력하세요.');return}if(state.play.found.join('')!==code){showToast('기록한 글자와 입력한 암호가 다릅니다. 순서를 확인하세요.');return}if(isNewRoom(state.play.room)&&!hangulFour(code)){showToast('한글 4글자를 입력하세요.');return}if(code===state.play.room.password){if(!state.play.finished){state.play.finished=true;state.play.elapsedMs=Math.max(1000,Date.now()-state.play.startedAt);persistPlay(true);}state.modal={type:'win'};render();if(!state.play.practice)saveEscapeResult()}else{showToast('최종 암호가 일치하지 않습니다. 교과서 위치를 다시 확인하세요.')}}

function b64urlEncode(s){let a=new TextEncoder().encode(s);let t='';for(let x of a)t+=String.fromCharCode(x);return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64urlDecode(s){let raw=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder().decode(Uint8Array.from(raw,ch=>ch.charCodeAt(0)))}
function codeRoom(room){return 'TRIGLAB2:'+b64urlEncode(JSON.stringify({format:'TRIG_TEXTBOOK_CIPHER_V2',room}))}
function decoded(text){let raw=String(text||'').trim(),match=raw.match(/(?:#|\?)room=([^&\s]+)/);if(match)raw='TRIGLAB2:'+decodeURIComponent(match[1]);if(!raw.startsWith('TRIGLAB2:'))throw new Error('올바른 공유 코드 또는 링크가 아닙니다.');const o=JSON.parse(b64urlDecode(raw.slice(9)));if(o.format!=='TRIG_TEXTBOOK_CIPHER_V2'||!validRoom(o.room))throw new Error('지원하지 않는 작품 데이터입니다.');return o.room}

dit':await saveEditedRoom();return;case 'cancel-edit':{if(!confirm('수정을 종료하고 새 방탈출 제작 화면으로 이동할까요? 작성 중인 변경 사항은 사라집니다.'))return;setEditTarget(null);state.draft=newDraft();state.edit=0;state.builderStage='setup';saveDraft();render();return}case 'edit-entry':beginEdit(btn.dataset.id);return;case 'delete-entry':askDelete(btn.dataset.id);return;case 'confirm-delete':await deleteEntry();return;case 'export-draft':{try{downloaded(cleanRoom(state.draft))}catch(e){showToast(e.message)}return}case 'import-file':importFile();return;case 'import-code':state.modal={type:'import-code'};render();return;case 'accept-code':{try{accepted(decoded($('#import-code')?.value))}catch(e){showToast(e.message)}return}case 'rank-entry':{const entry=getEntry(btn.dataset.id);if(entry){state.modal={type:'leaderboard',roomId:entry.room.id};render()}else showToast('방탈출 작품을 찾을 수 없습니다.');return}case 'detail-entry':{const entry=getEntry(btn.dataset.id);if(entry){state.modal={type:'detail',entry};render()}return}case 'play-entry':{const entry=getEntry(btn.dataset.id)||state.modal?.entry;if(entry)start(entry.room,entry);return}case 'export-entry':{const entry=getEntry(btn.dataset.id)||state.modal?.entry;if(entry)downloaded(entry.room);return}case 'share-entry':{const entry=getEntry(btn.dataset.id)||state.modal?.entry;if(entry){state.modal={type:'share',room:entry.room,code:codeRoom(entry.room)};render()}return}case 'share-draft':{try{const room=cleanRoom(state.draft);state.modal={type:'share',room,code:codeRoom(room)};render()}catch(e){showToast(e.message)}return}case 'export-room':downloaded(state.modal.room);return;case 'copy-code':await clipboard(state.modal.code);return;case 'copy-link':await clipboard(linkFor(state.modal.code));return;case 'close-modal':state.modal=null;render();return;case 'close-outside':if(e.target===btn){state.modal=null;render()}return;case 'choose-answer':{state.modal.choice=Number(btn.dataset.v);const selected=state.modal.choice;$$('.choices button').forEach((x,i)=>x.classLi function attach(){setInterval(timerTick,150);window.addEventListener('pagehide',()=>{if(state.page==='play')persistPlay(true)});document.addEventListener('click',doAction);document.addEventListener('change',e=>{if(e.target.matches('[data-photo-upload]'))attachPhoto(e.target)});document.addEventListener('input',e=>{if(e.target.matches('[data-field],[data-qfield],[data-opt],[data-found],#gallery-filter'))inputSync(e.target);if(e.target.id==='teacher-filter')teacherFilterList(e.target.value)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}else if(e.key==='Enter'&&e.target.id==='answer-input'){e.preventDefault();attempt()}else if(e.key==='Enter'&&e.target.id==='final-code'){e.preventDefault();finalCheck()}})}
function connectionAdvice(code,phase){
 const c=String(code||'');
 if(location.protocol==='file:')return '현재 HTML 파일을 직접 열고 있습니다(file://). GitHub Pages에 index.html로 업로드한 뒤 https://로 시작하는 실제 사이트 주소에서 다시 확인하세요.';
 if(c.includes('operation-not-allowed')||c.includes('admin-restricted-operation'))return 'Firebase 콘솔 > 보안 > Authentication > 로그인 방법에서 익명(Anonymous) 로그인 사용 설정을 켜고 저장하세요.';
 if(c.includes('permission-denied'))return 'Firestore Database > 규칙(Rules)에서 trigCipherRooms 컬렉션을 인증 사용자에게 읽기 허용하는 규칙을 게시했는지 확인하세요.';
 if(c.includes('unauthorized-domain'))return 'Firebase 콘솔 > Authentication > 설정 > 승인된 도메인에 접속 중인 사이트의 도메인(예: 사용자명.github.io)을 추가하세요.';
 if(c.includes('invalid-api-key')||c.includes('invalid-app-credential'))return 'Firebase 웹 앱 설정의 apiKey와 프로젝트 ID가 맞는지 확인하세요.';
 if(c.includes('network')||c.includes('unavailable')||c.includes('failed-to-fetch')||c.includes('Failed to fetch'))return '인터넷 연결, 브라우저 추적방지 설정, 학교 네트워크의 Firebase/Google CDN 차단 여부를 확인하세요. 다른 네트워크로도 시험해 보세요.';
 if(c.includes('unsupported'))return '브라우저 저장소가 차단되었을 수 있습니다. 일반 크롬/엣지 창에서 https:// 웹 주소로 열어 보세요.';
 if(phase==='Firebase 라이브러리 다운로드')return 'Firebase JavaScript 모듈을 다운로드하지 못했습니다. 인터넷 연결 또는 www.gstatic.com 접근 제한을 확인하세요.';
 return '아래 오류 코드와 메시지를 확인하고, Firebase 익명 인증 및 Firestore 규칙을 확인하세요. GitHub Pages를 사용 중이면 최신 index.html이 배포되었는지도 확인하세요.';
}
function connectionModal(){
 const place=location.protocol==='file:'?'내 컴퓨터의 HTML 파일':location.protocol==='https:'?'HTTPS 웹사이트':location.protocol+' 주소';
 const status=state.onlineActive?'온라인 공유 연결 성공':state.fbStatus==='error'?'연결 실패':'연결을 시도하는 중';
 const problem=state.fbStatus==='error'?`<div class="notebox error" style="margin-top:13px"><b>오류 코드:</b> ${esc(state.fbErrorCode||'코드 없음')}<br><b>상세:</b> ${esc(state.fbError||'알 수 없는 오류')}</div>`:'';
 return modal('Firebase 연결 진단',`<p><b>현재 상태:</b> ${esc(status)}</p><p class="smalltxt"><b>진행 단계:</b> ${esc(state.fbPhase)}<br><b>접속 방식:</b> ${esc(place)}<br><b>Firebase 프로젝트:</b> trig-lab</p>${problem}<div class="notebox ${state.onlineActive?'':'warn'}" style="margin-top:14px"><b>${state.onlineActive?'모둠 작품을 온라인으로 공유할 수 있습니다.':'확인할 사항'}</b><p style="margin:6px 0 0">${esc(state.onlineActive?'다른 태블릿에서도 같은 웹사이트 주소로 접속해 모둠 작품이 나타나는지 확인하세요.':connectionAdvice(state.fbErrorCode||state.fbError,state.fbPhase))}</p></div><div class="btnrow" style="margin-top:18px"><button class="btn primary" data-action="retry-firebase">다시 연결하기</button><button class="btn" data-action="close-modal">닫기</button></div><p class="tiny muted" style="margin-top:14px">Firebase 접속 오류는 사이트 제작물과 별개로 인증·네트워크·보안규칙 문제일 수 있습니다. 개인 정보는 게시하지 마세요.</p>`);
}
async function initFirebase(){
 const c=window.TRIG_LAB_FIREBASE_CONFIG;
 for(const fn of state.fbUnsubs){try{fn()}catch(e){console.warn(e)}}
 state.fbUnsubs=[];
 state.onlineActive=false;
 state.fb=null;state.rankingStatus='waiting';state.rankingsOnline=[];
 state.fbStatus='connecting';
 state.fbPhase='Firebase 설정 확인';
 state.fbError='';state.fbErrorCode='';
 render();
 if(!c||!c.apiKey||!c.projectId){
   state.fbStatus='error';state.fbErrorCode='config/missing';state.fbError='웹 앱 설정(firebaseConfig)이 누락되었습니다.';state.teacherStatus='error';state.teacherError='Firebase 프로젝트 설정이 없습니다.';render();return;
 }
 try{
   state.fbPhase='Firebase 라이브러리 다운로드';render();
   const {initializeApp,getApp,getApps}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
   const {getAuth,signInAnonymously,signInWithPopup,GoogleAuthProvider,signOut,onAuthStateChanged,setPersistence,browserSessionPersistence}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
   const {getFirestore,collection,addDoc,setDoc,updateDoc,deleteDoc,doc,getDoc,query,onSnapshot,serverTimestamp}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
   state.fbPhase='익명 로그인 중';render();
   const app=getApps().find(a=>a.name==='[DEFAULT]')||initializeApp(c),auth=getAuth(app);
   const user=await signInAnonymously(auth),db=getFirestore(app);
   state.fbUid=user.user.uid;
   state.fb={addRoom:room=>addDoc(collection(db,'trigCipherRooms'),{room,createdAt:serverTimestamp(),ownerUid:user.user.uid}),updateRoom:(docId,room)=>updateDoc(doc(db,'trigCipherRooms',docId),{room,updatedAt:serverTimestamp()}),deleteRoom:docId=>deleteDoc(doc(db,'trigCipherRooms',docId)),addFeedback:(roomId,record)=>addDoc(collection(db,'trigCipherFeedback'),{roomId,...record,createdAt:serverTimestamp(),ownerUid:user.user.uid}),addResult:r=>setDoc(doc(db,'trigCipherResults',r.attemptId),{attemptId:r.attemptId,roomId:r.roomId,teamNo:r.teamNo,durationMs:r.durationMs,finishedAt:serverTimestamp(),ownerUid:user.user.uid})};
    // 별도 Firebase 앱: 학생 익명 세션을 유지하면서 교사만 Google 로그인 가능
    if(state.teacherAuthUnsub){try{state.teacherAuthUnsub()}catch(e){}state.teacherAuthUnsub=null;}
    const teacherApp=getApps().find(a=>a.name==='trig-lab-teacher-admin')||initializeApp(c,'trig-lab-teacher-admin');
    const teacherAuth=getAuth(teacherApp);
    const teacherDb=getFirestore(teacherApp);
    state.teacherAuth=teacherAuth;state.teacherDb=teacherDb;
    state.teacherApi={signInWithPopup,GoogleAuthProvider,signOut,getDoc,doc,deleteDoc};
    try{await setPersistence(teacherAuth,browserSessionPersistence)}catch(e){console.warn('Teacher session persistence unavailable',e)}
    state.teacherAuthUnsub=onAuthStateChanged(teacherAuth,u=>{if(u)checkTeacherPermission(u);else{state.teacherStatus='signed-out';state.teacherUid='';state.teacherEmail='';if(state.page==='teacher')render()}},err=>{state.teacherStatus='error';state.teacherError=err.message||String(err);if(state.page==='teacher')render()});
    state.fbPhase='Firestore 갤러리 읽기 권한 확인';render();
   state.fbUnsubs.push(onSnapshot(query(collection(db,'trigCipherRooms')),snapshot=>{
     state.online=snapshot.docs.map(d=>({room:d.data().room,source:'online',docId:d.id,ownerUid:d.data().ownerUid})).filter(x=>validRoom(x.room)).slice(0,300);
     state.onlineActive=true;
     state.fbStatus='connected';state.fbPhase='온라인 갤러리 실시간 연결 완료';state.fbError='';state.fbErrorCode='';render();
   },err=>{
     state.onlineActive=false;state.fbStatus='error';state.fbPhase='Firestore 갤러리 읽기 실패';state.fbErrorCode=err.code||'firestore/unknown';state.fbError=err.message||String(err);console.warn('Gallery subscription error',err);render();
   }));
   state.fbUnsubs.push(onSnapshot(query(collection(db,'trigCipherFeedback')),snapshot=>{
     const remote={};for(const doc of snapshot.docs){const f=doc.data();if(!f.roomId||typeof f.team!=='string'||typeof f.text!=='string')continue;(remote[f.roomId]??=[]).push({team:f.team,text:f.text,at:f.at||0});}
     for(const [roomId,items] of Object.entries(remote)){
       const a=state.feedback[roomId]||[];const have=new Set(a.map(x=>[x.team,x.text,x.at].join('|')));
       for(const item of items){const sig=[item.team,item.text,item.at].join('|');if(!have.has(sig)){a.push(item);have.add(sig)}}state.feedback[roomId]=a.slice(-50);
     }
     if(state.modal?.type==='detail')render();
    },err=>console.warn('Feedback subscription error',err)));
    state.rankingStatus='waiting';state.fbUnsubs.push(onSnapshot(query(collection(db,'trigCipherResults')),snapshot=>{state.rankingsOnline=snapshot.docs.map(doc=>{const v=doc.data();return {attemptId:v.attemptId,roomId:v.roomId,teamNo:v.teamNo,durationMs:v.durationMs,finishedAt:v.finishedAt?.toMillis?.()||0}});state.rankingStatus='connected';state.rankingError='';refreshRanking();if(state.play?.finished&&!state.play?.onlineSaved)saveEscapeResult()},err=>{console.warn('Ranking subscription error',err);state.rankingStatus='error';state.rankingError=err.code||err.message;refreshRanking()}));
 }catch(err){
   console.warn('Firebase not connected',err);state.onlineActive=false;state.fbStatus='error';state.fbErrorCode=err.code||err.name||'firebase/unknown';state.fbError=err.message||String(err);if(state.teacherStatus==='initializing'){state.teacherStatus='error';state.teacherError='Firebase 연결 실패: '+state.fbError;}render();
 }
}
function initLink(){const hash=location.hash;const m=hash.match(/^#room=(.+)$/);if(!m)return;try{const room=decoded('TRIGLAB2:'+decodeURIComponent(m[1]));if(!state.local.some(x=>x.room.id===room.id))putLocal(room);start(room,{room,source:'link'});history.replaceState(null,'',location.href.split('#')[0]);}catch(err){console.warn('Invalid room link',err)}}
attach();restoreActivePlay();render();initLink();initFirebase();
})();
