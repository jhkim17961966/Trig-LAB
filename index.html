const elapsedFormat=ms=>{const sec=Math.floor(Math.max(0,ms)/1000),minutes=Math.floor(sec/60),s=sec%60,centi=Math.floor((Math.max(0,ms)%1000)/10);return `${String(minutes).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(centi).padStart(2,'0')}`};
function rankingFor(roomId){
 const merged=[...state.rankingsOnline,...state.rankingsLocal.filter(r=>!state.rankingsOnline.some(o=>o.attemptId===r.attemptId))];
 const best=new Map();
 for(const r of merged){if(r.roomId!==roomId||!Number.isInteger(r.teamNo)||r.teamNo<1||r.teamNo>30||!Number.isFinite(r.durationMs)||r.durationMs<1000||r.durationMs>7200000)continue;
 const old=best.get(r.teamNo);if(!old||r.durationMs<old.durationMs||(r.durationMs===old.durationMs&&r.finishedAt<old.finishedAt))best.set(r.teamNo,r);
 }
 return [...best.values()].sort((a,b)=>a.durationMs-b.durationMs||a.teamNo-b.teamNo);
}

function refreshRanking(){document.querySelectorAll('.rank-board[data-room-id]').forEach(el=>{const holder=document.createElement('div');holder.innerHTML=rankingHtml(el.dataset.roomId);el.replaceWith(holder.firstElementChild)});document.querySelectorAll('.rank-top[data-room-id]').forEach(el=>{const top=rankingFor(el.dataset.roomId);el.textContent=top.length?`🏆 1위 ${top[0].teamNo}조 · ${elapsedFormat(top[0].durationMs)}`:'첫 탈출 기록 도전!'})}
function timerTick(){const s=state.play,el=document.getElementById('play-timer');if(!el||!s)return;el.textContent=s.finished?elapsedFormat(s.elapsedMs):(s.startedAt!==null?elapsedFormat(performance.now()-s.startedAt):'00:00.00')}
async function saveEscapeResult(){const s=state.play;if(!s||s.practice||s.saved||!s.finished)return;s.saved=true;
 const result={attemptId:id(),roomId:s.room.id,teamNo:s.teamNo,durationMs:s.elapsedMs,finishedAt:Date.now()};
 state.rankingsLocal.unshift(result);state.rankingsLocal=state.rankingsLocal.slice(0,250);store(RK,state.rankingsLocal);refreshRanking();

 if(!state.onlineActive||!state.fb?.addResult){if(status)status.textContent='이 기기에만 기록되었습니다. 온라인 공유를 확인하세요.';return}

 catch(e){console.warn('Ranking write failed',e);if(status)status.textContent='온라인 기록 실패: Firestore 규칙의 trigCipherResults 권한을 확인하세요. 이 기기에는 저장됐습니다.'}

<aside class="settings"><section class="card pad"><div class="boxhead"><h2>연구소 설계 현황</h2><span class="pill neutral">${prog} / 7 입력 완료</span></div>${scene(d,[],false)}<div class="scenefoot"><span>7 PUZZLES / 4 CLUES</span><strong>${esc(d.name)}</strong></div><div class="divider"></div><h3 style="font-size:15px">힌트 배치도</h3><div class="clue-grid">${d.puzzles.map((q,i)=>`<button data-action="edit-tab" data-i="${i}" class="clue-chip ${q.clueSlot?'hasclue':'isblank'}"><small>${i+1}번 ${i<4?'삼각비':'넌센스'}</small><b>${q.clueSlot?'🔑 힌트 '+q.clueSlot:'꽝'}</b></button>`).join('')}</div><div class="divider"></div><h3 style="font-size:15px">최종 암호 글자 점검</h3><div class="clue-preview">${[1,2,3,4].map(x=>{const q=cluePuzzle(d,x);return `<div><small>힌트 ${x}</small><b>${esc(q?.letter||'?')}</b></div>`}).join('')}</div><p class="tiny muted" style="margin-top:9px">위 순서대로 읽으면 최종 암호 <b>${esc(d.password||'????')}</b>가 되어야 해요.</p><div class="checklist">${[['삼각비 4문제 입력',d.puzzles.slice(0,4).every(p=>p.prompt.trim()&&p.answer.trim())],['넌센스 3문제 입력',d.puzzles.slice(4).every(p=>p.prompt.trim()&&p.answer.trim())],['힌트 4개와 꽝 3개 배치',clued===4],['한글 4글자 암호 작성',hangulFour(d.password)],['교과서 위치 4개 작성',d.puzzles.filter(p=>p.clueSlot>0).every(p=>p.page&&p.line&&p.index&&p.letter)],['힌트 글자와 최종 암호 일치',[1,2,3,4].map(x=>cluePuzzle(d,x)?.letter||'').join('')===d.password&&hangulFour(d.password)]].map(x=>`<div class="checkrow"><span class="checkmark ${x[1]?'ok':''}">${x[1]?'✓':'–'}</span>${x[0]}</div>`).join('')}</div>${err.length?`<div class="notebox warn" style="margin-top:17px"><strong>게시 전 확인할 항목 ${err.length}개</strong><br>${esc(err[0])}${err.length>1?` 외 ${err.length-1}개`:''}</div>`:`<div class="notebox" style="margin-top:16px">문제와 단서 입력이 완료됐습니다. 실제 교과서에서 각 위치를 다시 검증하세요.</div>`}<div class="actions"><button class="btn primary" data-action="test-draft">미리 탈출해 보기</button><button class="btn" data-action="publish">갤러리에 게시</button><button class="btn light" data-action="export-draft">작품 파일 저장</button></div><div class="divider"></div><div class="btnrow"><button class="btn small" data-action="import-file">작품 가져오기</button><button class="btn small danger" data-action="reset-draft">새 연구소 만들기</button></div><p class="tiny muted" style="margin:13px 0 0">임시 저장은 현재 기기에서 이루어지고, 갤러리에 게시하면 Firebase를 통해 다른 기기에 공유됩니다.</p></section></aside></div></div>`}
function gallery(){const list=displayed().filter(x=>`${x.room.name} ${x.room.team} ${x.room.book}`.toLowerCase().includes(state.filter.toLowerCase()));return `<div class="wrap section"><div class="pagehead"><div><span class="eyebrow">CLASSROOM LAB ARCHIVE</span><h1>우리 반 연구소 갤러리</h1><p>다른 모둠이 출제한 삼각비 문제를 해결하고, 교과서에서 암호를 찾아보세요.</p></div><button class="btn primary" data-go="builder">+ 연구소 제작</button></div><div class="notebox ${state.onlineActive?'':'warn'}" style="margin-bottom:20px"><b>${state.onlineActive?'온라인 공유 연결됨':'현재는 기기별 로컬 갤러리입니다.'}</b><br>${state.onlineActive?'동일한 Firebase 프로젝트에 게시된 연구소가 모든 접속 기기에 표시됩니다. 학생 실명과 개인정보는 입력하지 마세요.':'다른 태블릿에 작품이 자동으로 나타나지는 않습니다. 아래 작품 파일 가져오기 또는 웹사이트 배포 후 공유 링크를 이용할 수 있습니다. 실시간 학급 갤러리는 교사가 Firebase를 설정하면 사용할 수 있습니다.'}</div><div class="btnrow" style="margin-bottom:19px"><input class="input" style="max-width:350px" id="gallery-filter" placeholder="모둠·연구소·교과서 검색" value="${esc(state.filter)}"><button class="btn" data-action="import-file">작품 파일 가져오기</button><button class="btn" data-action="import-code">작품 공유 코드 입력</button><button class="btn" data-action="online-guide">공유 방법</button></div>${list.length?`<div class="gallery-grid">${list.map(entry=>`<div class="card gallery-card"><div class="gallery-art">${scene(entry.room,[],false)}</div><div class="gallery-body"><div class="gallery-head"><span class="pill neutral">${esc(entry.room.team)}</span><span class="tiny muted">${entry.room.puzzles.length} 장치 · ${entry.source==='online'?'온라인':'저장됨'}</span></div><h3>${esc(entry.room.name)}</h3><div class="rank-top" data-room-id="${esc(entry.room.id)}">${rankingFor(entry.room.id).length?`🏆 1위 ${rankingFor(entry.room.id)[0].teamNo}조 · ${elapsedFormat(rankingFor(entry.room.id)[0].durationMs)}`:"첫 탈출 기록 도전!"}</div><p>${esc(entry.room.story).slice(0,110)}</p><div class="gallery-actions"><button class="btn small primary" data-action="play-entry" data-id="${esc(entry.room.id)}">탈출 도전</button><button class="btn small" data-action="detail-entry" data-id="${esc(entry.room.id)}">작품·피드백</button></div></div></div>`).join('')}</div>`:`<div class="empty"><h3>등록된 연구소가 없습니다.</h3><p>첫 번째 방탈출을 제작하거나 다른 모둠이 공유한 작품 파일을 가져오세요.</p><div class="btnrow" style="justify-content:center"><button class="btn primary" data-go="builder">첫 작품 제작</button><button class="btn" data-action="play-sample">샘플 체험</button></div></div>`}</div>`}
function playPage(){const s=state.play,d=s.room,n=s.solved.size,isNew=isNewRoom(d),clues=revealedClueCount(s),target=neededClues(d);return `<div class="wrap section"><div class="pagehead"><div><span class="eyebrow">ESCAPE CHALLENGE · BOOK CIPHER</span><h1>${esc(d.name)}</h1><p>${esc(d.team)} 제작 · 출처: ${esc(d.book)}${d.publisher?' · '+esc(d.publisher):''}</p></div><div class="btnrow"><button class="btn" data-action="reset-play">처음부터</button><button class="btn" data-go="gallery">갤러리로</button></div></div><div class="timerbanner"><div><span>도전 모둠</span><div><b>${s.practice?'연습 모드':s.teamNo?`${s.teamNo}조`:'모둠 선택 전'}</b></div></div><div><span>탈출까지 걸린 시간</span><div><b id="play-timer">${s.finished?elapsedFormat(s.elapsedMs):s.startedAt!==null?elapsedFormat(performance.now()-s.startedAt):'00:00.00'}</b></div></div><span>${s.practice?'연습 기록은 순위에 포함되지 않아요':'한글 4글자 최종 암호를 맞히면 시간이 멈춰요'}</span></div><div class="playgrid"><div><section class="card pad"><div class="boxhead"><h2>보안 연구소 탐색</h2><span class="pill">해결한 문제 ${n}/${d.puzzles.length} · 획득한 힌트 ${clues}/${target}</span></div>${scene(d,[...s.solved])}<div class="scenefoot"><span>장치를 눌러 ${isNew?'삼각비·넌센스':'삼각비'} 문제를 해결하세요.</span><strong>${clues===target?'최종 인증 가능':'SECURITY ACTIVE'}</strong></div><div class="progress"><span style="width:${Math.round(100*clues/target)}%"></span></div><div class="roomnote">${esc(d.story)}</div>${d.sample?`<div class="actions"><button class="btn light" data-action="sample-book">데모 연구 자료집 열기</button><span class="tipline">샘플 연구소는 실제 교과서 대신 제공된 연구 자료집을 사용합니다.</span></div>`:''}</section></div><aside><div class="card pad"><div class="boxhead"><h2>교과서 암호 기록함</h2><span class="pill neutral">${clues}/${target} 힌트</span></div><p class="tiny muted" style="margin-top:-4px">${isNew?'힌트 4개가 어느 문제에 들어 있는지 찾아보세요. 꽝에서는 암호 위치가 나오지 않아요.':'문제를 해결하면 교과서 위치가 공개됩니다.'}</p><div class="journal-list">${isNew?[1,2,3,4].map(slot=>{const ix=d.puzzles.findIndex(p=>p.clueSlot===slot),p=d.puzzles[ix],got=s.solved.has(ix);return `<div class="journal-entry ${got?'got':''}"><div class="entrytop"><span>암호 ${slot}번째 글자</span><span>${got?'HINT ACQUIRED':'LOCKED'}</span></div>${got?`<p><b>${esc(p.page)}쪽 · ${esc(p.line)}번째 줄 · ${esc(p.index)}번째 글자</b></p><div class="found-row"><input class="charinput" maxlength="1" data-found="${slot-1}" value="${esc(s.found[slot-1]||'')}" aria-label="암호 ${slot}번째 글자"><span class="tiny muted">교과서에서 찾은 글자</span></div>`:`<p>단서가 숨겨진 문제를 찾아 해결하세요.</p>`}</div>`}).join(''):d.puzzles.map((p,i)=>`<div class="journal-entry ${s.solved.has(i)?'got':''}"><div class="entrytop"><span>DATA ${String(i+1).padStart(2,'0')} · ${esc(TYPES[p.object][0])}</span><span>${s.solved.has(i)?'UNLOCKED':'LOCKED'}</span></div>${s.solved.has(i)?`<p><b>${esc(p.page)}쪽 · ${esc(p.line)}번째 줄 · ${esc(p.index)}번째 글자</b></p><div class="found-row"><input class="charinput" maxlength="1" data-found="${i}" value="${esc(s.found[i]||'')}"></div>`:`<p>보안 장치를 먼저 해제하세요.</p>`}</div>`).join('')}</div><div class="divider"></div><h3 style="font-size:16px;margin-bottom:5px">최종 출입문 암호</h3><div class="letterboxes">${Array.from({length:target},(_,i)=>`<div class="letterbox">${esc(s.found[i]||'?')}</div>`).join('')}</div><div class="field"><label>${isNew?'한글 4글자를':'찾은 글자를'} 순서대로 이어 입력</label><input id="final-code" class="input" placeholder="${isNew?'한글 4글자 입력':'탈출 암호'}" maxlength="${target}" autocomplete="off"></div><button class="btn primary full" data-action="final-submit">최종 보안 해제</button><div class="tiny muted" style="margin-top:9px">${isNew?'4개의 힌트를 모두 획득하면 꽝 문제를 풀지 않아도 탈출할 수 있어요.':'책 없이 추측하지 말고 단서를 모두 확인하세요.'}</div></div><section class="card pad" style="margin-top:14px"><div class="boxhead"><h2>🏆 이 방탈출 순위</h2><span class="pill neutral">모둠별 최고 기록</span></div>${rankingHtml(d.id)}</section></aside></div></div>`}
function modal(title,body){return `<div class="modalback" data-action="close-outside"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialoghead"><h2>${title}</h2><button class="iconbtn" aria-label="닫기" data-action="close-modal">×</button></div><div class="dialogbody">${body}</div></div></div>`}
function modalHtml(){if(!state.modal)return '';const m=state.modal,play=state.play,d=play?.room;switch(m.type){case 'connection-status':return connectionModal();case 'riddle-bank':return nonsenseModal();case 'start-escape':return modal('방탈출 도전 시작',`<div class="notebox"><b>${esc(d.name)}</b><br>시작 버튼을 누르는 순간부터 최종 암호를 맞힐 때까지 시간을 측정합니다.</div>${play.practice?'<p class="smalltxt muted" style="margin:13px 0">이 도전은 샘플·제작 테스트이므로 순위표에 등록되지 않습니다.</p>':`<div class="field" style="margin-top:14px"><label>체험하는 모둠 번호 (1~30조) *</label><input type="number" class="input" min="1" max="30" step="1" id="start-team" value="${esc(play.teamNo||'')}" placeholder="예: 3" autocomplete="off"></div><p class="tiny muted">학생 이름 대신 모둠 번호만 기록됩니다. 모둠별 최고 기록만 순위에 반영돼요.</p>`}<button class="btn primary full" data-action="begin-escape" style="margin-top:14px">${play.practice?'연습 시작':'타이머 시작 · 탈출 도전!'}</button><div class="divider"></div><h3 style="font-size:16px">이 방탈출 현재 순위</h3>${rankingHtml(d.id)}`);case 'puzzle':{const p=d.puzzles[m.i],isChoice=p.type==='choice',isNew=isNewRoom(d);return modal('SECURITY MODULE · '+esc(p.title),`<span class="pill">${m.i+1}/${d.puzzles.length} · ${esc(TYPES[p.object][0])} ${isNew?'· '+(p.kind==='trig'?'삼각비':'넌센스'):''}</span><h3 style="margin:16px 0 8px">${isNew&&p.kind==='nonsense'?'넌센스 수수께끼':'보안 알고리즘 해독'}</h3><div class="puzzletext">${esc(p.prompt)}</div>${triangle(p)}<div id="answer-message" style="margin:12px 0"></div>${isChoice?`<div class="choices">${p.choices.map((a,i)=>`<button data-action="choose-answer" data-v="${i}" class="${m.choice===i?'selected':''}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div>`:`<div class="formgrid" style="margin-top:14px"><input id="answer-input" class="input" placeholder="정답을 입력하세요" autocomplete="off"><button class="btn primary" data-action="submit-answer">정답 제출</button></div>`}<div class="actions" style="justify-content:${isChoice?'space-between':'flex-start'}"><button class="btn small light" data-action="reveal-hint">문제 풀이 도움말</button>${isChoice?'<button class="btn primary" data-action="submit-answer">선택한 답 제출</button>':''}</div><div id="hint-slot"></div><p class="tipline" style="margin-top:14px">정답을 맞히면 힌트가 나올 수도, 꽝이 나올 수도 있습니다.</p>`)}
case 'clue':{const p=d.puzzles[m.i],slot=isNewRoom(d)?Number(p.clueSlot):m.i+1;return modal('🔑 암호 힌트 '+slot+'번 획득',`<div class="notebox"><b>정답! 암호의 ${slot}번째 글자 위치를 찾았습니다.</b><br>교과서에서 실제 글자를 찾아 기록함에 적어 주세요.</div><div class="coord" style="margin:18px 0;grid-template-columns:repeat(3,1fr)"><div class="coordbox"><b>${esc(p.page)}</b><span>페이지</span></div><div class="coordbox"><b>${esc(p.line)}</b><span>번째 줄</span></div><div class="coordbox"><b>${esc(p.index)}</b><span>번째 글자</span></div></div>${p.clueText?`<div class="notebox">${esc(p.clueText)}</div>`:''}<h3 style="font-size:15px">제작 모둠의 해설</h3><div class="roomnote" style="white-space:pre-wrap">${esc(p.solution||'작성된 해설이 없습니다.')}</div><p class="tiny muted" style="margin-top:12px">정답 글자는 이 화면에 공개되지 않습니다. <b>${esc(d.book)}</b>에서 직접 찾아보세요.</p><button class="btn primary full" data-action="close-modal">연구소로 돌아가기</button>`)}

div class="field"><label>작성 모둠</label><input id="fb-team" class="input" maxlength="40" placeholder="예: 2반 3모둠"></div><div class="field"><label>탐구 과정에서 발견한 내용</label><textarea id="fb-text" class="textarea" maxlength="300" placeholder="예: sin 30° 문제를 해결한 뒤 교과서에서 글자를 찾는 과정이 좋았어요."></textarea></div><button class="btn primary" data-action="submit-feedback">피드백 등록</button>`);case 'import-code':return modal('작품 공유 코드 가져오기',`<p class="smalltxt muted">다른 모둠이 보낸 <b>작품 코드</b>를 붙여 넣으세요. 교사가 배포한 사이트 링크에 작품 데이터가 포함된 경우 링크 자체로도 열 수 있습니다.</p><div class="field"><label>작품 코드 또는 공유 링크</label><textarea id="import-code" class="textarea sharetextarea" placeholder="TRIGLAB2:..."></textarea></div><button class="btn primary" data-action="accept-code">연구소 가져오기</button>`);case 'share':return modal('방탈출 작품 공유',`<div class="notebox"><b>공유 코드</b>는 작품의 문제·정답·암호를 함께 담고 있습니다. 플레이 전에 코드 내용을 직접 열람하지 않도록 해 주세요.</div><div class="field" style="margin-top:15px"><label>공유 코드</label><textarea id="sharecode" class="textarea sharetextarea" readonly>${esc(m.code)}</textarea></div><div class="btnrow"><button class="btn primary" data-action="copy-code">코드 복사</button><button class="btn" data-action="copy-link">작품 링크 복사</button><button class="btn" data-action="export-room">파일 다운로드</button></div><p class="tiny muted" style="margin-top:13px">공유 링크는 웹사이트가 <b>GitHub Pages 등 공개 주소에 배포되어 있을 때</b> 다른 태블릿에서도 열립니다. 파일로 열었다면 JSON 파일을 전달하세요.</p>`);case 'help':return modal('TRIG LAB 제작·수업 안내',`<ol class="smalltxt"><li><b>최종 암호:</b> 공백 없이 한글 4글자를 정합니다.</li><li><b>문제 출제:</b> 삼각비 문제 4개와 넌센스 문제 3개, 총 7문제를 직접 제작합니다.</li><li><b>결과 배치:</b> 7개 가운데 4개 문제에 힌트 1·2·3·4를 하나씩 배정하고, 나머지 3개에는 꽝을 설정합니다. 힌트가 어느 유형에 들어갈지는 자유입니다.</li><li><b>교과서 단서:</b> 힌트 문제마다 암호 글자의 페이지·줄·글자 번호를 기록합니다.</li><li><b>체험:</b> 다른 모둠은 시작 전에 모둠 번호를 입력하고 타이머를 켠 뒤, 힌트 네 개를 획득하여 탈출합니다. 탈출 시간은 해당 연구소 순위에 반영됩니다.</li></ol><div class="notebox warn">동일한 교과서 판본과 글자 세기 규칙을 사용하세요. 문제 정답과 실제 위치의 정확성은 제작 모둠이 확인해야 합니다.</div>`);

function render(){const page=state.page==='builder'?builder():state.page==='gallery'?gallery():state.page==='play'&&state.play?playPage():home();$('#root').innerHTML=header()+`<main class="main">${page}</main><footer class="wrap footer">TRIG LAB · TEXTBOOK CIPHER PROJECT · 중3 삼각비 협력 탐구 · 학생 실명 대신 모둠 이름 사용</footer>`+modalHtml()}
function goto(page){state.modal=null;state.page=page;render();window.scrollTo({top:0,behavior:'instant'})}
function inputSync(target){const f=target.dataset.field,q=target.dataset.qfield,opt=target.dataset.opt;if(f){state.draft[f]=target.value;saveDraft()}else if(q){const p=state.draft.puzzles[state.edit];if(q==='clueSlot'){const previous=Number(p.clueSlot)||0,next=Number(target.value);if(previous!==next){if(next>0){const other=state.draft.puzzles.find((x,i)=>i!==state.edit&&Number(x.clueSlot)===next);if(other)other.clueSlot=previous;}else if(previous>0){const other=state.draft.puzzles.find((x,i)=>i!==state.edit&&Number(x.clueSlot)===0);if(other)other.clueSlot=previous;}p.clueSlot=next;}saveDraft();render();return}if(q==='object'){const other=state.draft.puzzles.find((x,i)=>i!==state.edit&&x.object===target.value);if(other)other.object=p.object;}p[q]=q==='diagram'?target.value==='true':q==='angle'?Number(target.value):target.value;saveDraft();if(['type','object','diagram','angle'].includes(q))render()}else if(opt!==undefined){state.draft.puzzles[state.edit].choices[Number(opt)]=target.value;saveDraft()}else if(target.id==='gallery-filter'){state.filter=target.value;const pos=target.selectionStart;render();const input=$('#gallery-filter');input?.focus();input?.setSelectionRange(pos,pos)}else if(target.dataset.found!==undefined&&state.play){const index=Number(target.dataset.found);state.play.found[index]=[...target.value].slice(0,1).join('');const node=$$('.letterbox')[index];if(node)node.textContent=state.play.found[index]||'?'}}
 
function answerNorm(x){return String(x??'').normalize('NFKC').toLowerCase().replace(/\\sqrt\{([^}]+)\}/g,'√$1').replace(/sqrt\s*\(([^)]+)\)/g,'√$1').replace(/sqrt\s*/g,'√').replace(/루트/g,'√').replace(/[\s°,㎝]/g,'').replace(/\*/g,'×').replace(/[()]/g,'').replace(/\.$/,'')}
function correct(user,answer){let u=answerNorm(user);return String(answer??'').split('|').some(a=>{let t=answerNorm(a);if(u===t)return true;let x=Number(u),y=Number(t);return u!==''&&t!==''&&Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<1e-8})}
function start(room,entry=null,options={}){if(!validRoom(room)){showToast('작품 데이터가 올바르지 않습니다.');return}state.play={room:clone(room),solved:new Set(),found:Array(neededClues(room)).fill(''),choice:null,entry,practice:!!options.practice||!!room.sample,teamNo:null,startedAt:null,elapsedMs:null,finished:false,saved:false};goto('play');state.modal={type:'start-escape'};render()}
function getEntry(q){return displayed().find(x=>x.room.id===q)}
function puzzleOpen(index){if(!state.play)return;if(state.play.startedAt===null){state.modal={type:'start-escape'};render();return}if(state.play.finished){showToast('이미 탈출한 연구소입니다. 새로 도전하려면 처음부터를 눌러 주세요.');return} if(state.play.solved.has(index)){const puzzle=state.play.room.puzzles[index];state.modal={type:isNewRoom(state.play.room)&&!puzzle.clueSlot?'blank':'clue',i:index};render();return}state.modal={type:'puzzle',i:index,choice:null};render()}
function attempt(){const m=state.modal,p=state.play.room.puzzles[m.i],chosen=p.type==='choice'?p.choices[m.choice]:$('#answer-input')?.value;if(!chosen){showToast('정답을 선택하거나 입력하세요.');return}if(correct(chosen,p.answer)){state.play.solved.add(m.i);state.modal={type:isNewRoom(state.play.room)&&!p.clueSlot?'blank':'clue',i:m.i};render()}else{$('#answer-message').innerHTML='<div class="notebox error">정답이 아닙니다. 모둠원과 다시 생각해 보세요.</div>'}}
function finalCheck(){if(!state.play)return;const code=String($('#final-code')?.value||'').replace(/\s/g,'');const target=neededClues(state.play.room);if(revealedClueCount(state.play)<target){showToast(`힌트 ${target}개를 모두 찾아야 탈출할 수 있어요.`);return}if(state.play.found.some(x=>!x)){showToast('교과서에서 찾은 글자를 기록함에 모두 입력하세요.');return}if(state.play.found.join('')!==code){showToast('기록한 글자와 입력한 암호가 다릅니다. 순서를 확인하세요.');return}if(isNewRoom(state.play.room)&&!hangulFour(code)){showToast('한글 4글자를 입력하세요.');return}if(code===state.play.room.password){if(!state.play.finished){state.play.finished=true;state.play.elapsedMs=Math.max(1000,Math.round(performance.now()-state.play.startedAt));}state.modal={type:'win'};render();if(!state.play.practice)saveEscapeResult()}else{showToast('최종 암호가 일치하지 않습니다. 교과서 위치를 다시 확인하세요.')}}
function cleanRoom(d){const v=clone(d);v.team=v.team.trim();v.name=v.name.trim();v.book=v.book.trim();v.password=v.password.trim();v.puzzles.forEach((p,i)=>{p.kind=i<4?'trig':'nonsense';p.clueSlot=Number(p.clueSlot)||0;p.prompt=p.prompt.trim();p.answer=p.answer.trim();p.letter=String(p.letter||'').trim();if(p.clueSlot){p.page=Number(p.page);p.line=Number(p.line);p.index=Number(p.index);}else{p.page='';p.line='';p.index='';p.letter=''} });v.createdAt=Date.now();if(issues(v).length)throw new Error(issues(v)[0]);if(!validRoom(v))throw new Error('작품 데이터에 잘못된 입력이 있습니다.');return v}
function downloaded(room){const content=JSON.stringify({format:'TRIG_TEXTBOOK_CIPHER_V2',room},null,2);const blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=('TRIG_LAB_'+room.team+'_'+room.name).replace(/[\\/:*?"<>|]/g,'_').slice(0,85)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function putLocal(room){const old=state.local.filter(x=>x.room.id!==room.id);old.unshift({room,createdAt:Date.now()});state.local=old.slice(0,120);store(GK,state.local)}
async function publish(){let v;try{v=cleanRoom(state.draft)}catch(e){showToast(e.message);return}v.id=id();state.draft.id=v.id;saveDraft();putLocal(v);let postedOnline=false;if(state.onlineActive&&state.fb){try{await state.fb.addRoom(v);postedOnline=true}catch(e){console.warn(e);showToast('기기에 저장했지만 온라인 게시에 실패했습니다.')}}state.modal={type:'published',postedOnline};render()}
function b64urlEncode(s){let a=new TextEncoder().encode(s);let t='';for(let x of a)t+=String.fromCharCode(x);return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64urlDecode(s){let raw=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder().decode(Uint8Array.from(raw,ch=>ch.charCodeAt(0)))}
function codeRoom(room){return 'TRIGLAB2:'+b64urlEncode(JSON.stringify({format:'TRIG_TEXTBOOK_CIPHER_V2',room}))}
function decoded(text){let raw=String(text||'').trim(),match=raw.match(/(?:#|\?)room=([^&\s]+)/);if(match)raw='TRIGLAB2:'+decodeURIComponent(match[1]);if(!raw.startsWith('TRIGLAB2:'))throw new Error('올바른 공유 코드 또는 링크가 아닙니다.');const o=JSON.parse(b64urlDecode(raw.slice(9)));if(o.format!=='TRIG_TEXTBOOK_CIPHER_V2'||!validRoom(o.room))throw new Error('지원하지 않는 작품 데이터입니다.');return o.room}
function accepted(room,intoDraft=false){if(!validRoom(room))throw Error('작품 데이터가 올바르지 않습니다.');if(intoDraft){state.draft=clone(room);state.edit=0;saveDraft();goto('builder')}else{putLocal(room);goto('gallery');showToast('새 연구소를 갤러리에 가져왔습니다.')}}
function importFile(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{if(!input.files?.[0])return;try{const data=JSON.parse(await input.files[0].text());if(data.format!=='TRIG_TEXTBOOK_CIPHER_V2')throw Error('지원되지 않는 파일 형식입니다.');accepted(data.room)}catch(e){showToast(e.message||'파일을 읽을 수 없습니다.')}};input.click()}
function feedbackFor(id){return state.feedback[id]||[]}
function getFeedback(id){return feedbackFor(id)}
async function submitFeedback(){const room=state.modal?.entry?.room||state.play?.room;if(!room)return;const team=$('#fb-team')?.value.trim(),message=$('#fb-text')?.value.trim();if(!team||!message){showToast('모둠 이름과 피드백을 모두 입력하세요.');return}if(message.length>300)return;const record={team:team.slice(0,40),text:message.slice(0,300),at:Date.now()};const arr=feedbackFor(room.id);arr.push(record);state.feedback[room.id]=arr.slice(-35);store(FK,state.feedback);if(state.onlineActive&&state.fb){try{await state.fb.addFeedback(room.id,record)}catch(e){console.warn('Online feedback unavailable',e)}}showToast('피드백을 남겼습니다.');state.modal={type:'detail',entry:state.play?.entry||getEntry(room.id)||{room}};render()}
async function clipboard(v){try{await navigator.clipboard.writeText(v);showToast('클립보드에 복사했습니다.')}catch{const x=$('#sharecode');if(x){x.focus();x.select();showToast('텍스트가 선택되었습니다. 복사해 주세요.')}else showToast('브라우저에서 복사가 제한됩니다.')}}
function linkFor(code){const base=location.href.split('#')[0];return base+'#room='+encodeURIComponent(code.slice(9))}
async function doAction(e){const btn=e.target.closest('[data-action],[data-go]');if(!btn)return;if(btn.closest('.modalback')&&btn.dataset.action==='close-outside'&&e.target!==btn)return;if(btn.dataset.go){e.preventDefault();goto(btn.dataset.go);return}const a=btn.dataset.action;switch(a){case 'noop':return;case 'connection-status':state.modal={type:'connection-status'};render();return;case 'riddle-bank':state.modal={type:'riddle-bank'};render();return;case 'use-riddle':{if(state.edit<4||state.page!=='builder'){showToast('넌센스 5~7번 칸을 선택해 주세요.');return}const r=RIDDLES[Number(btn.dataset.i)];if(!r)return;state.draft.puzzles[state.edit].prompt=r[0];state.draft.puzzles[state.edit].answer=r[1];state.draft.puzzles[state.edit].type='short';saveDraft();state.modal=null;render();showToast('예시 문제와 정답을 입력했어요. 원하는 대로 수정해 보세요.');return}case 'begin-escape':{if(!state.play)return;let n=null;if(!state.play.practice){n=Number($('#start-team')?.value);if(!Number.isInteger(n)||n<1||n>30){showToast('모둠 번호를 1부터 30까지의 정수로 입력하세요.');$('#start-team')?.focus();return}}state.play.teamNo=n;state.play.startedAt=performance.now();state.modal=null;render();return}case 'retry-firebase':state.modal=null;initFirebase();return;case 'inspect':{if(state.page!=='play')return;const k=btn.dataset.kind,i=state.play.room.puzzles.findIndex(x=>x.object===k);if(i>=0)puzzleOpen(i);else {showToast(TYPES[k][0]+'에 별도 보안 장치가 없습니다.')}return}case 'door':if(state.page==='play'){if(state.play.startedAt===null){state.modal={type:'start-escape'};render();return}if(revealedClueCount(state.play)===neededClues(state.play.room)){$('#final-code')?.focus();showToast('암호 힌트 4개를 모았습니다. 최종 암호를 입력하세요.')}else{state.modal={type:'door'};render()}}return;case 'play-sample':start(sampleRoom(),null,{practice:true});return;case 'sample-book':state.modal={type:'sample-book'};render();return;case 'edit-tab':state.edit=Number(btn.dataset.i);render();return;case 'add-puzzle':{if(state.draft.puzzles.length>=5){showToast('보안 장치는 최대 5개까지입니다.');return}const used=new Set(state.draft.puzzles.map(x=>x.object));const p=blankPuzzle(state.draft.puzzles.length);p.object=Object.keys(TYPES).find(x=>!used.has(x))||p.object;state.draft.puzzles.push(p);state.edit=state.draft.puzzles.length-1;saveDraft();render();return}case 'remove-puzzle':{if(state.draft.puzzles.length<=2)return;state.draft.puzzles.splice(state.edit,1);state.edit=Math.max(0,Math.min(state.edit,state.draft.puzzles.length-1));saveDraft();render();return}case 'move-puzzle':{const i=state.edit,j=i+Number(btn.dataset.dir);if(j<0||j>=state.draft.puzzles.length)return;const arr=state.draft.puzzles;[arr[i],arr[j]]=[arr[j],arr[i]];state.edit=j;saveDraft();render();return}case 'reset-draft':{if(!confirm('현재 작성한 연구소를 초기화하고 새 연구소를 만드시겠습니까? 먼저 작품 파일 저장을 권장합니다.'))return;state.draft=newDraft();state.edit=0;saveDraft();render();return}case 'test-draft':{try{start(cleanRoom(state.draft),null,{practice:true})}catch(err){showToast('테스트 전: '+err.message)}return}case 'publish':await publish();return;case 'export-draft':{try{downloaded(cleanRoom(state.draft))}catch(e){showToast(e.message)}return}case 'import-file':importFile();return;case 'import-code':state.modal={type:'import-code'};render();return;case 'accept-code':{try{accepted(decoded($('#import-code')?.value))}catch(e){showToast(e.message)}return}case 'detail-entry':{const entry=getEntry(btn.dataset.id);if(entry){state.modal={type:'detail',entry};render()}return}case 'play-entry':{const entry=getEntry(btn.dataset.id)||state.modal?.entry;if(entry)start(entry.room,entry);return}case 'export-entry':{const entry=getEntry(btn.dataset.id)||state.modal?.entry;if(entry)downloaded(entry.room);return}case 'share-entry':{const entry=getEntry(btn.dataset.id)||state.modal?.entry;if(entry){state.modal={type:'share',room:entry.room,code:codeRoom(entry.room)};render()}return}case 'share-draft':{try{const room=cleanRoom(state.draft);state.modal={type:'share',room,code:codeRoom(room)};render()}catch(e){showToast(e.message)}return}case 'export-room':downloaded(state.modal.room);return;case 'copy-code':await clipboard(state.modal.code);return;case 'copy-link':await clipboard(linkFor(state.modal.code));return;case 'close-modal':state.modal=null;render();return;case 'close-outside':if(e.target===btn){state.modal=null;render()}return;case 'choose-answer':{state.modal.choice=Number(btn.dataset.v);const selected=state.modal.choice;$$('.choices button').forEach((x,i)=>x.classList.toggle('selected',i===selected));return}case 'submit-answer':attempt();return;case 'reveal-hint':{const p=state.play.room.puzzles[state.modal.i];$('#hint-slot').innerHTML=`<div class="notebox" style="margin-top:11px">${esc(p.hint||'해당 각의 sin, cos, tan의 정의를 떠올려 보세요.')}</div>`;return}case 'final-submit':finalCheck();return;case 'reset-play':{if(confirm('지금까지 모은 단서를 초기화하고 다시 시작할까요?'))start(state.play.room,state.play.entry,{practice:state.play.practice});return}case 'feedback-open':state.modal={type:'feedback'};render();return;case 'submit-feedback':await submitFeedback();return;case 'help':state.modal={type:'help'};render();return;case 'online-guide':state.modal={type:'online-guide'};render();return;default:return}}
function attach(){setInterval(timerTick,150);document.addEventListener('click',doAction);document.addEventListener('input',e=>{if(e.target.matches('[data-field],[data-qfield],[data-opt],[data-found],#gallery-filter'))inputSync(e.target)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}else if(e.key==='Enter'&&e.target.id==='answer-input'){e.preventDefault();attempt()}else if(e.key==='Enter'&&e.target.id==='final-code'){e.preventDefault();finalCheck()}})}
function connectionAdvice(code,phase){
 const c=String(code||'');
 if(location.protocol==='file:')return '현재 HTML 파일을 직접 열고 있습니다(file://). GitHub Pages에 index.html로 업로드한 뒤 https://로 시작하는 실제 사이트 주소에서 다시 확인하세요.';
 if(c.includes('operation-not-allowed')||c.includes('admin-restricted-operation'))return 'Firebase 콘솔 > 보안 > Authentication > 로그인 방법에서 익명(Anonymous) 로그인 사용 설정을 켜고 저장하세요.';
 if(c.includes('permission-denied'))return 'Firestore Database > 규칙(Rules)에서 trigCipherRooms 컬렉션을 인증 사용자에게 읽기 허용하는 규칙을 게시했는지 확인하세요.';
 if(c.includes('unauthorized-domain'))return 'Firebase 콘솔 > Authentication > 설정 > 승인된 도메인에 접속 중인 사이트의 도메인(예: 사용자명.github.io)을 추가하세요.';
 if(c.includes('invalid-api-key')||c.includes('invalid-app-credential'))return 'Firebase 웹 앱 설정의 apiKey와 프로젝트 ID가 맞는지 확인하세요.';
 if(c.includes('network')||c.includes('unavailable')||c.includes('failed-to-fetch')||c.includes('Failed to fetch'))return '인터넷 연결, 브라우저 추적방지 설정, 학교 네트워크의 Firebase/Google CDN 차단 여부를 확인하세요. 다른 네트워크로도 시험해 보세요.';
 if(c.includes('unsupported'))return '브라우저 저장소가 차단되었을 수 있습니다. 일반 크롬/엣지 창에서 https:// 웹 주소로 열어 보세요.';
 if(phase==='Firebase 라이브러리 다운로드')return 'Firebase JavaScript 모듈을 다운로드하지 못했습니다. 인터넷 연결 또는 www.gstatic.com 접근 제한을 확인하세요.';
 return '아래 오류 코드와 메시지를 확인하고, Firebase 익명 인증 및 Firestore 규칙을 확인하세요. GitHub Pages를 사용 중이면 최신 index.html이 배포되었는지도 확인하세요.';
}
function connectionModal(){
 const place=location.protocol==='file:'?'내 컴퓨터의 HTML 파일':location.protocol==='https:'?'HTTPS 웹사이트':location.protocol+' 주소';
 const status=state.onlineActive?'온라인 공유 연결 성공':state.fbStatus==='error'?'연결 실패':'연결을 시도하는 중';
 const problem=state.fbStatus==='error'?`<div class="notebox error" style="margin-top:13px"><b>오류 코드:</b> ${esc(state.fbErrorCode||'코드 없음')}<br><b>상세:</b> ${esc(state.fbError||'알 수 없는 오류')}</div>`:'';
 return modal('Firebase 연결 진단',`<p><b>현재 상태:</b> ${esc(status)}</p><p class="smalltxt"><b>진행 단계:</b> ${esc(state.fbPhase)}<br><b>접속 방식:</b> ${esc(place)}<br><b>Firebase 프로젝트:</b> trig-lab</p>${problem}<div class="notebox ${state.onlineActive?'':'warn'}" style="margin-top:14px"><b>${state.onlineActive?'모둠 작품을 온라인으로 공유할 수 있습니다.':'확인할 사항'}</b><p style="margin:6px 0 0">${esc(state.onlineActive?'다른 태블릿에서도 같은 웹사이트 주소로 접속해 모둠 작품이 나타나는지 확인하세요.':connectionAdvice(state.fbErrorCode||state.fbError,state.fbPhase))}</p></div><div class="btnrow" style="margin-top:18px"><button class="btn primary" data-action="retry-firebase">다시 연결하기</button><button class="btn" data-action="close-modal">닫기</button></div><p class="tiny muted" style="margin-top:14px">Firebase 접속 오류는 사이트 제작물과 별개로 인증·네트워크·보안규칙 문제일 수 있습니다. 개인 정보는 게시하지 마세요.</p>`);
}
async function initFirebase(){
 const c=window.TRIG_LAB_FIREBASE_CONFIG;
 for(const fn of state.fbUnsubs){try{fn()}catch(e){console.warn(e)}}
 state.fbUnsubs=[];
 state.onlineActive=false;
 state.fb=null;state.rankingStatus='waiting';state.rankingsOnline=[];
 state.fbStatus='connecting';
 state.fbPhase='Firebase 설정 확인';
 state.fbError='';state.fbErrorCode='';
 render();
 if(!c||!c.apiKey||!c.projectId){
   state.fbStatus='error';state.fbErrorCode='config/missing';state.fbError='웹 앱 설정(firebaseConfig)이 누락되었습니다.';render();return;
 }
 try{
   state.fbPhase='Firebase 라이브러리 다운로드';render();
   const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
   const {getAuth,signInAnonymously}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
   const {getFirestore,collection,addDoc,query,onSnapshot,serverTimestamp}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
   state.fbPhase='익명 로그인 중';render();
   const app=initializeApp(c),auth=getAuth(app);
   const user=await signInAnonymously(auth),db=getFirestore(app);
   state.fbUid=user.user.uid;
   state.fb={addRoom:room=>addDoc(collection(db,'trigCipherRooms'),{room,createdAt:serverTimestamp(),ownerUid:user.user.uid}),addFeedback:(roomId,record)=>addDoc(collection(db,'trigCipherFeedback'),{roomId,...record,createdAt:serverTimestamp(),ownerUid:user.user.uid}),addResult:r=>addDoc(collection(db,'trigCipherResults'),{attemptId:r.attemptId,roomId:r.roomId,teamNo:r.teamNo,durationMs:r.durationMs,finishedAt:serverTimestamp(),ownerUid:user.user.uid})};
   state.fbPhase='Firestore 갤러리 읽기 권한 확인';render();
   state.fbUnsubs.push(onSnapshot(query(collection(db,'trigCipherRooms')),snapshot=>{
     state.online=snapshot.docs.map(doc=>({room:doc.data().room,source:'online'})).filter(x=>validRoom(x.room)).slice(0,300);
     state.onlineActive=true;
     state.fbStatus='connected';state.fbPhase='온라인 갤러리 실시간 연결 완료';state.fbError='';state.fbErrorCode='';render();
   },err=>{
     state.onlineActive=false;state.fbStatus='error';state.fbPhase='Firestore 갤러리 읽기 실패';state.fbErrorCode=err.code||'firestore/unknown';state.fbError=err.message||String(err);console.warn('Gallery subscription error',err);render();
   }));
   state.fbUnsubs.push(onSnapshot(query(collection(db,'trigCipherFeedback')),snapshot=>{
     const remote={};for(const doc of snapshot.docs){const f=doc.data();if(!f.roomId||typeof f.team!=='string'||typeof f.text!=='string')continue;(remote[f.roomId]??=[]).push({team:f.team,text:f.text,at:f.at||0});}
     for(const [roomId,items] of Object.entries(remote)){
       const a=state.feedback[roomId]||[];const have=new Set(a.map(x=>[x.team,x.text,x.at].join('|')));
       for(const item of items){const sig=[item.team,item.text,item.at].join('|');if(!have.has(sig)){a.push(item);have.add(sig)}}state.feedback[roomId]=a.slice(-50);
     }
     if(state.modal?.type==='detail')render();
    },err=>console.warn('Feedback subscription error',err)));
    state.rankingStatus='waiting';state.fbUnsubs.push(onSnapshot(query(collection(db,'trigCipherResults')),snapshot=>{state.rankingsOnline=snapshot.docs.map(doc=>{const v=doc.data();return {attemptId:v.attemptId,roomId:v.roomId,teamNo:v.teamNo,durationMs:v.durationMs,finishedAt:v.finishedAt?.toMillis?.()||0}});state.rankingStatus='connected';state.rankingError='';refreshRanking()},err=>{console.warn('Ranking subscription error',err);state.rankingStatus='error';state.rankingError=err.code||err.message;refreshRanking()}));
 }catch(err){
   console.warn('Firebase not connected',err);state.onlineActive=false;state.fbStatus='error';state.fbErrorCode=err.code||err.name||'firebase/unknown';state.fbError=err.message||String(err);render();
 }
}
function initLink(){const hash=location.hash;const m=hash.match(/^#room=(.+)$/);if(!m)return;try{const room=decoded('TRIGLAB2:'+decodeURIComponent(m[1]));if(!state.local.some(x=>x.room.id===room.id))putLocal(room);start(room,{room,source:'link'});history.replaceState(null,'',location.href.split('#')[0]);}catch(err){console.warn('Invalid room link',err)}}
attach();render();initLink();initFirebase();
})();
</script></body></html>
